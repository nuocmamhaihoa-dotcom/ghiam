<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thư viện quảng cáo Fanpage</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">A</div>
    <div>
      <strong>Thư viện quảng cáo Fanpage</strong>
      <small>Nhập từ khóa để xem quảng cáo đang chạy</small>
    </div>
  </header>
  <main>
    <section class="search">
      <h1>Tìm quảng cáo</h1>
      <form id="form">
        <div class="bar">
          <label class="sr" for="keyword">Từ khóa</label>
          <input id="keyword" type="search" maxlength="100" autocomplete="off" autofocus placeholder="nước mắm">
          <button id="go" type="submit">Tìm</button>
        </div>
        <details class="filters">
          <summary>Bộ lọc thêm</summary>
          <div class="filter-grid">
            <div class="field">
              <label for="match">Cách khớp</label>
              <select id="match">
                <option value="any" selected>Có các từ</option>
                <option value="exact">Đúng cụm từ</option>
              </select>
            </div>
            <div class="field">
              <label for="country">Quốc gia</label>
              <select id="country">
                <option value="VN" selected>Việt Nam</option>
                <option value="US">Hoa Kỳ</option>
                <option value="GB">Anh</option>
                <option value="SG">Singapore</option>
                <option value="TH">Thái Lan</option>
                <option value="JP">Nhật Bản</option>
              </select>
            </div>
            <div class="field">
              <label for="status">Trạng thái</label>
              <select id="status">
                <option value="ACTIVE" selected>Đang chạy</option>
                <option value="INACTIVE">Đã dừng</option>
                <option value="ALL">Tất cả</option>
              </select>
            </div>
            <div class="field wide">
              <label for="fanpage">Link Fanpage, nếu muốn giới hạn một trang</label>
              <input id="fanpage" type="url" placeholder="để trống nếu chỉ tìm từ khóa">
            </div>
          </div>
        </details>
      </form>
      <p id="message" role="status">Nhập từ khóa rồi bấm Tìm. Dấu phẩy nghĩa là hoặc.</p>
      <p id="setup" class="note" hidden></p>
    </section>
    <section class="stats" aria-live="polite">
      <div class="stat"><span>Quảng cáo đã tải</span><strong id="count">0</strong></div>
      <div class="stat"><span id="subject-label">Phạm vi</span><strong id="page-name">—</strong></div>
    </section>
    <div class="heading"><h2>Kết quả</h2></div>
    <nav class="tabs" role="tablist" aria-label="Kiểu hiển thị kết quả">
      <button type="button" class="tab active" id="cards-tab" role="tab" aria-selected="true">Thẻ quảng cáo</button>
      <button type="button" class="tab" id="table-tab" role="tab" aria-selected="false">Bảng danh sách</button>
    </nav>
    <div id="results" class="results" role="tabpanel"></div>
    <section id="table-panel" class="table-panel" role="tabpanel" hidden>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Thứ tự</th>
              <th>Fanpage</th>
              <th>Mã thư viện</th>
              <th>Bắt đầu chạy</th>
              <th>Nền tảng</th>
              <th>Tiêu đề</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <p id="table-empty" class="empty">Chưa có quảng cáo nào.</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
