name: contact-to-vcf-windows

on:
  workflow_dispatch:
  push:
    paths:
      - "contact_to_vcf/**"
      - ".github/workflows/contact-to-vcf-windows.yml"

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          python -m pip install -r contact_to_vcf/requirements.txt
          python -m pytest contact_to_vcf/tests -q

      - name: Build exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm contact_to_vcf/ContactToVCF.spec

      - name: Assemble release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Force dist/ContactToVCF.exe release/ContactToVCF.exe
          Copy-Item -Force contact_to_vcf/release/README.txt release/README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ContactToVCF-windows
          path: |
            release/ContactToVCF.exe
            release/README.txt
