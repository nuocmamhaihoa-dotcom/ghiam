# Control plane trên VPS: Postgres + server CommentScope (API, dashboard, bộ lập lịch) + Caddy (HTTPS).
# Chuẩn bị: cp .env.example .env, điền đủ giá trị, trỏ tên miền về VPS, rồi: docker compose up -d --build
name: commentscope

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: commentscope
      POSTGRES_USER: commentscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Điền POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commentscope -d commentscope"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://commentscope:${POSTGRES_PASSWORD}@db:5432/commentscope
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Điền DOMAIN trong .env}
      ACME_EMAIL: ${ACME_EMAIL:?Điền ACME_EMAIL trong .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
