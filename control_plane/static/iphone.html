<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="iphone-build" content="__IPHONE_BUILD__" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>fb-poller</title>
  <style>
    :root { --text: #111; --muted: #8a8f98; --font: -apple-system, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: var(--text);
      background: #fff;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
      padding: calc(0.55rem + env(safe-area-inset-top)) max(0.9rem, env(safe-area-inset-right)) 0.55rem max(0.9rem, env(safe-area-inset-left));
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    h1 { font-size: 1.05rem; margin: 0; }
    #updateNote { margin: 0; color: #0a7a32; font-weight: 700; font-size: 0.95rem; }
    main { flex: 1; min-height: 0; position: relative; }
    .view { height: 100%; overflow: auto; -webkit-overflow-scrolling: touch; }
    #view-controls { overflow: hidden; }
    #controls { width: 100%; height: 100%; border: 0; background: #10141b; }
    .install { margin: 0; padding: 0.65rem 0.9rem; background: #f4f7fb; color: #243044; }
    .install button { margin-top: 0.45rem; min-height: 44px; font-size: 16px; }
    #view-saved { padding: 0.4rem 0.7rem 1rem; }
    #view-saved table { width: 100%; border-collapse: collapse; }
    #view-saved th, #view-saved td { text-align: left; padding: 0.55rem 0.35rem; border-bottom: 1px solid #eee; vertical-align: top; font-size: 0.95rem; }
    #view-saved th { color: var(--muted); font-weight: 650; }
    nav.app {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem;
      padding: 0.4rem max(0.6rem, env(safe-area-inset-right)) calc(0.4rem + env(safe-area-inset-bottom)) max(0.6rem, env(safe-area-inset-left));
      background: #fff; border-top: 1px solid #eee;
    }
    nav.app button {
      min-height: 48px; border: 0; border-radius: 10px; background: #f4f5f7;
      font-size: 16px; font-weight: 700; color: #111;
    }
    nav.app button.on { background: #111; color: #fff; }
    body.is-quiet header,
    body.is-quiet nav.app,
    body.is-quiet .install,
    body.is-quiet main { display: none !important; }
    #cornerDock[hidden] { display: none !important; }
    #cornerDock {
      position: fixed; z-index: 50;
      top: calc(0.55rem + env(safe-area-inset-top));
      right: max(0.55rem, env(safe-area-inset-right));
    }
    #cornerEnd {
      min-height: 40px; padding: 0 0.8rem; border: 0; border-radius: 999px;
      background: #111; color: #fff; font: inherit; font-size: 14px; font-weight: 700;
    }
    #endVideo {
      position: fixed; width: 2px; height: 2px; left: 0; bottom: 0;
      opacity: 0.01; pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>fb-poller</h1>
    <p id="updateNote" hidden></p>
  </header>
  <p class="install" id="install">Bấm Chia sẻ, rồi Thêm vào Màn hình chính.
    <br /><button type="button" id="installHide">Đã hiểu</button>
  </p>
  <main>
    <section class="view" id="view-controls">
      <iframe id="controls" title="Điều khiển" src="/?as=iphone"></iframe>
    </section>
    <section class="view" id="view-saved" hidden>
      <table>
        <thead><tr><th>Tên</th><th>Tên trong danh bạ</th><th>Username</th></tr></thead>
        <tbody id="savedRows"><tr><td colspan="3">Chưa có người đã lưu.</td></tr></tbody>
      </table>
    </section>
  </main>
  <div id="cornerDock" data-norecord hidden>
    <button id="cornerEnd" type="button">Kết thúc</button>
  </div>
  <video id="endVideo" playsinline webkit-playsinline loop src="/static/ket-thuc.mp4"></video>
  <nav class="app">
    <button type="button" data-app="controls" class="on">Điều khiển</button>
    <button type="button" data-app="saved">Đã lưu</button>
  </nav>
  <script>
    const hubToken = __CONTROL_TOKEN_JSON__;
    if (hubToken) localStorage.setItem("fb_poller_control_token", hubToken);
  </script>
  <script src="/static/version.js"></script>
  <script src="/static/watch.js?v=__IPHONE_BUILD__"></script>
  <script>
    const install = document.getElementById("install");
    const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    if (standalone || localStorage.getItem("fb_poller_iphone_install") === "1") install.hidden = true;
    document.getElementById("installHide").addEventListener("click", () => {
      localStorage.setItem("fb_poller_iphone_install", "1");
      install.hidden = true;
    });
    const views = {
      controls: document.getElementById("view-controls"),
      saved: document.getElementById("view-saved"),
    };
    function showApp(name) {
      Object.entries(views).forEach(([key, node]) => { node.hidden = key !== name; });
      document.querySelectorAll("[data-app]").forEach((button) => {
        button.classList.toggle("on", button.getAttribute("data-app") === name);
      });
    }
    document.querySelectorAll("[data-app]").forEach((button) => {
      button.addEventListener("click", () => showApp(button.getAttribute("data-app")));
    });
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }
    function draw(items) {
      const rows = document.getElementById("savedRows");
      if (!items.length) {
        rows.innerHTML = "<tr><td colspan=\"3\">Chưa có người đã lưu.</td></tr>";
        return;
      }
      rows.innerHTML = items.map((person) =>
        "<tr><td>" + esc(person.name) + "</td><td>" + esc(person.contactName) + "</td><td>" + esc(person.username) + "</td></tr>"
      ).join("");
    }
    document.addEventListener("people-saved", (event) => draw(event.detail || []));
    document.addEventListener("people-auth", () => {
      document.getElementById("savedRows").innerHTML = "<tr><td colspan=\"3\">Chưa lưu được danh sách.</td></tr>";
    });
    (async function loadSaved() {
      const token = localStorage.getItem("fb_poller_control_token") || "";
      const headers = {};
      if (token) headers.Authorization = "Bearer " + token;
      const response = await fetch("/v1/people", { headers: headers });
      if (!response.ok) return;
      const data = await response.json();
      draw(data.items || []);
    })();

    const endVideo = document.getElementById("endVideo");
    let quietTimer = 0;
    let closing = false;
    let pipSeen = false;

    function endPhoneUse() {
      if (closing) return;
      closing = true;
      pipSeen = false;
      if (quietTimer) window.clearInterval(quietTimer);
      quietTimer = 0;
      document.body.classList.remove("is-quiet");
      document.getElementById("cornerDock").hidden = true;
      document.getElementById("cornerEnd").textContent = "Kết thúc";
      try {
        if (document.pictureInPictureElement === endVideo) document.exitPictureInPicture();
        if (endVideo.webkitPresentationMode === "picture-in-picture" && endVideo.webkitSetPresentationMode) {
          endVideo.webkitSetPresentationMode("inline");
        }
      } catch (error) {
        /* PiP đã đóng */
      }
      endVideo.pause();
      showApp("controls");
      closing = false;
    }

    function floatEnd() {
      try {
        endVideo.muted = false;
        const playing = endVideo.play();
        if (typeof endVideo.webkitSetPresentationMode === "function") {
          endVideo.webkitSetPresentationMode("picture-in-picture");
        } else if (document.pictureInPictureEnabled && document.pictureInPictureElement !== endVideo) {
          const request = endVideo.requestPictureInPicture();
          if (request && typeof request.catch === "function") request.catch(() => {});
        }
        if (playing && typeof playing.then === "function") {
          playing.then(() => {
            const floating = endVideo.webkitPresentationMode === "picture-in-picture"
              || document.pictureInPictureElement === endVideo;
            if (!floating) endVideo.pause();
          }).catch(() => {});
        }
      } catch (error) {
        /* Nút Kết thúc trên trang vẫn bấm được */
      }
    }

    function beginPhoneUse(delay) {
      closing = false;
      if (quietTimer) window.clearInterval(quietTimer);
      quietTimer = 0;
      document.body.classList.add("is-quiet");
      document.getElementById("cornerDock").hidden = false;
      const button = document.getElementById("cornerEnd");
      if (!delay) {
        button.textContent = "Kết thúc";
        floatEnd();
        return;
      }
      const ends = Date.now() + 10000;
      button.textContent = "10";
      quietTimer = window.setInterval(() => {
        if (!document.body.classList.contains("is-quiet")) {
          window.clearInterval(quietTimer);
          quietTimer = 0;
          return;
        }
        if (document.hidden) return;
        const left = Math.ceil((ends - Date.now()) / 1000);
        if (left > 0) {
          button.textContent = String(left);
          return;
        }
        window.clearInterval(quietTimer);
        quietTimer = 0;
        button.textContent = "Kết thúc";
        floatEnd();
      }, 250);
    }
    window.beginPhoneUse = beginPhoneUse;

    document.getElementById("cornerEnd").addEventListener("click", () => endPhoneUse());
    endVideo.addEventListener("leavepictureinpicture", () => {
      if (pipSeen) endPhoneUse();
    });
    endVideo.addEventListener("webkitpresentationmodechanged", () => {
      if (endVideo.webkitPresentationMode === "picture-in-picture") {
        pipSeen = true;
        return;
      }
      if (pipSeen) endPhoneUse();
    });
    window.addEventListener("message", (event) => {
      if (event.origin !== location.origin) return;
      const data = event.data || {};
      if (data.type !== "fb-arm") return;
      beginPhoneUse(Boolean(data.delay));
    });
  </script>
</body>
</html>
