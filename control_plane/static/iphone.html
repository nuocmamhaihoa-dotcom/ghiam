<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="iphone-build" content="__IPHONE_BUILD__" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>fb-poller</title>
  <style>
    :root { --font: -apple-system, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: #111;
      background: #fff;
      font-size: 18px;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    #updateNote[hidden] { display: none !important; }
    #updateNote { margin: 0; padding: 0.7rem 1rem 0; color: #0a7a32; font-weight: 700; }
    main { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; padding: 1rem 1.1rem 0.6rem; }
    p.lead { margin: 0.2rem 0 0.8rem; line-height: 1.45; }
    #stepList { margin: 0.4rem 0 0; padding-left: 1.3rem; }
    #stepList li { margin: 0.55rem 0; }
    #pick {
      display: flex; align-items: center; justify-content: center;
      min-height: 64px; margin: 0.7rem max(0.8rem, env(safe-area-inset-right)) calc(0.7rem + env(safe-area-inset-bottom)) max(0.8rem, env(safe-area-inset-left));
      border-radius: 16px; background: #111; color: #fff;
      font-size: 20px; font-weight: 800;
    }
    #pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    #pick.busy { opacity: 0.45; }
  </style>
</head>
<body>
  <p id="updateNote" hidden></p>
  <main>
    <p class="lead">Vuốt mở Trung tâm điều khiển, bấm nút ghi hình, dùng các ứng dụng, rồi bấm thanh đỏ để dừng.</p>
    <ol id="stepList"></ol>
  </main>
  <label id="pick">Chọn video
    <input id="videoFile" type="file" accept="video/*" />
  </label>
  <script>
    const hubToken = __CONTROL_TOKEN_JSON__;
    if (hubToken) localStorage.setItem("fb_poller_control_token", hubToken);
  </script>
  <script src="/static/version.js"></script>
  <script src="/static/watch.js?v=__IPHONE_BUILD__"></script>
  <script>
    const pick = document.getElementById("pick");
    const fileInput = document.getElementById("videoFile");
    const list = document.getElementById("stepList");
    let busy = false;

    function showMessage(text) {
      list.replaceChildren();
      const item = document.createElement("li");
      item.textContent = text;
      list.appendChild(item);
    }

    function showSteps(steps) {
      list.replaceChildren();
      if (!steps.length) {
        showMessage("Không đọc được chữ trên video. Quay rõ hơn rồi chọn lại.");
        return;
      }
      steps.forEach((step) => {
        const item = document.createElement("li");
        item.textContent = step.caption || "Bước";
        list.appendChild(item);
      });
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = "";
      if (!file || busy) return;
      busy = true;
      pick.classList.add("busy");
      showMessage("Đang đọc video...");
      const body = new FormData();
      body.append("file", file, file.name || "man-hinh.mp4");
      const headers = {};
      const token = localStorage.getItem("fb_poller_control_token") || "";
      if (token) headers.Authorization = "Bearer " + token;
      let response;
      try {
        response = await fetch("/v1/recordings/from-video", { method: "POST", headers: headers, body: body });
      } catch (error) {
        showMessage("Chưa gửi được video. Mở lại trang rồi chọn lại.");
        pick.classList.remove("busy");
        busy = false;
        return;
      }
      if (!response.ok) {
        showMessage("Chưa đọc được video. Chọn đúng bản ghi màn hình.");
        pick.classList.remove("busy");
        busy = false;
        return;
      }
      const data = await response.json();
      showSteps(data.steps || []);
      pick.classList.remove("busy");
      busy = false;
    });
  </script>
</body>
</html>
