<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="iphone-build" content="__IPHONE_BUILD__" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>fb-poller</title>
  <style>
    :root { --font: -apple-system, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: #111;
      background: #fff;
      font-size: 18px;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
    }
    #updateNote[hidden] { display: none !important; }
    #updateNote { margin: 0; padding: 0.4rem 1rem 0; color: #0a7a32; font-weight: 700; }
    #pad { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
    #stepList { margin: 0; padding: 1.1rem 1.3rem 0.6rem; }
    #stepList li { margin: 0.45rem 0; }
    #stepList p { margin: 1.2rem 0.2rem; color: #666; }
    #actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;
      padding: 0.7rem max(0.8rem, env(safe-area-inset-right)) calc(0.7rem + env(safe-area-inset-bottom)) max(0.8rem, env(safe-area-inset-left));
      background: #fff;
    }
    #startBtn, #endBtn {
      min-height: 64px; border-radius: 16px; border: 2px solid #111;
      font: inherit; font-size: 20px; font-weight: 800;
    }
    #startBtn { background: #111; color: #fff; }
    #endBtn { background: #fff; color: #111; }
    #startBtn:disabled, #endBtn:disabled { opacity: 0.35; }
  </style>
</head>
<body>
  <p id="updateNote" hidden></p>
  <main id="pad">
    <div id="stepList"><p>Bấm Bắt đầu, rồi chạm hoặc kéo trên màn hình.</p></div>
  </main>
  <div id="actions" data-norecord>
    <button id="startBtn" type="button">Bắt đầu</button>
    <button id="endBtn" type="button" disabled>Kết thúc</button>
  </div>
  <script>
    const hubToken = __CONTROL_TOKEN_JSON__;
    if (hubToken) localStorage.setItem("fb_poller_control_token", hubToken);
  </script>
  <script src="/static/version.js"></script>
  <script src="/static/watch.js?v=__IPHONE_BUILD__"></script>
  <script>
    const startBtn = document.getElementById("startBtn");
    const endBtn = document.getElementById("endBtn");
    const capture = { on: false, t0: 0, events: [], down: null };
    let lastGesture = 0;
    let saving = false;

    function authHeaders() {
      const token = localStorage.getItem("fb_poller_control_token") || "";
      const headers = { "Content-Type": "application/json" };
      if (token) headers.Authorization = "Bearer " + token;
      return headers;
    }

    function captionOf(event) {
      const name = event.label || "màn hình";
      if (event.intent === "swipe") return "Vuốt tại " + name;
      return "Chạm " + name;
    }

    function showLines(lines) {
      const root = document.getElementById("stepList");
      root.replaceChildren();
      if (!lines.length) {
        const empty = document.createElement("p");
        empty.textContent = "Chưa có bước. Bấm Bắt đầu, chạm hoặc kéo trên màn hình, rồi bấm Kết thúc.";
        root.appendChild(empty);
        return;
      }
      const list = document.createElement("ol");
      lines.forEach((line) => {
        const item = document.createElement("li");
        item.textContent = line;
        list.appendChild(item);
      });
      root.appendChild(list);
    }

    function paint() {
      showLines(capture.events.map(captionOf));
    }

    function ignored(target) {
      return target instanceof Element && Boolean(target.closest("[data-norecord]"));
    }

    function pointerDown(x, y, target) {
      if (!capture.on || ignored(target)) {
        capture.down = null;
        return;
      }
      capture.down = { x: x, y: y };
    }

    function pointerUp(x, y, target) {
      if (!capture.on || !capture.down) return;
      const now = performance.now();
      if (now - lastGesture < 80) {
        capture.down = null;
        return;
      }
      if (ignored(target)) {
        capture.down = null;
        return;
      }
      const start = capture.down;
      capture.down = null;
      lastGesture = now;
      const moved = Math.hypot(x - start.x, y - start.y);
      capture.events.push({
        t: Math.max(0, Math.round(now - capture.t0)),
        kind: "pointer",
        phase: "up",
        target: "body",
        x: Math.round(x),
        y: Math.round(y),
        pointerType: "touch",
        click: false,
        intent: moved > 36 ? "swipe" : "tap",
        label: "màn hình",
      });
      paint();
    }

    document.addEventListener("pointerdown", (event) => {
      pointerDown(event.clientX, event.clientY, event.target);
    }, true);
    document.addEventListener("pointerup", (event) => {
      pointerUp(event.clientX, event.clientY, event.target);
    }, true);
    document.addEventListener("pointercancel", (event) => {
      pointerUp(event.clientX, event.clientY, event.target);
    }, true);
    document.addEventListener("touchstart", (event) => {
      const touch = event.changedTouches && event.changedTouches[0];
      if (!touch) return;
      pointerDown(touch.clientX, touch.clientY, event.target);
    }, true);
    document.addEventListener("touchend", (event) => {
      const touch = event.changedTouches && event.changedTouches[0];
      if (!touch) return;
      pointerUp(touch.clientX, touch.clientY, event.target);
    }, true);
    document.addEventListener("touchcancel", (event) => {
      const touch = event.changedTouches && event.changedTouches[0];
      if (!touch) return;
      pointerUp(touch.clientX, touch.clientY, event.target);
    }, true);

    startBtn.addEventListener("click", () => {
      if (capture.on || saving) return;
      capture.on = true;
      capture.t0 = performance.now();
      capture.events = [];
      capture.down = null;
      startBtn.disabled = true;
      endBtn.disabled = false;
      document.getElementById("stepList").replaceChildren();
    });

    endBtn.addEventListener("click", async () => {
      if (!capture.on || saving) return;
      capture.on = false;
      capture.down = null;
      saving = true;
      startBtn.disabled = false;
      endBtn.disabled = true;
      const events = capture.events.slice();
      if (!events.length) {
        showLines([]);
        startBtn.disabled = false;
        saving = false;
        return;
      }
      const headers = authHeaders();
      const saved = await fetch("/v1/recordings", {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ title: "Thao tác trên điện thoại", events: events }),
      });
      const parsed = await fetch("/v1/recordings/parse", {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ events: events }),
      });
      if (!saved.ok || !parsed.ok) {
        const note = document.createElement("p");
        note.textContent = "Chưa lưu được. Bấm Bắt đầu rồi làm lại.";
        document.getElementById("stepList").appendChild(note);
        saving = false;
        return;
      }
      const steps = (await parsed.json()).steps || [];
      showLines(steps.map((step) => step.caption || step.kind || "Bước"));
      saving = false;
    });
  </script>
</body>
</html>
