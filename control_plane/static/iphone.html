<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="iphone-build" content="__IPHONE_BUILD__" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>fb-poller</title>
  <style>
    :root { --text: #111; --muted: #8a8f98; --font: -apple-system, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: var(--text);
      background: #fff;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
      padding: calc(0.55rem + env(safe-area-inset-top)) max(0.9rem, env(safe-area-inset-right)) 0.55rem max(0.9rem, env(safe-area-inset-left));
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    h1 { font-size: 1.05rem; margin: 0; }
    #updateNote { margin: 0; color: #0a7a32; font-weight: 700; font-size: 0.95rem; }
    main { flex: 1; min-height: 0; position: relative; }
    .view { height: 100%; overflow: auto; -webkit-overflow-scrolling: touch; }
    #view-controls { overflow: hidden; }
    #controls { width: 100%; height: 100%; border: 0; background: #10141b; }
    .install { margin: 0; padding: 0.65rem 0.9rem; background: #f4f7fb; color: #243044; }
    .install button { margin-top: 0.45rem; min-height: 44px; font-size: 16px; }
    #view-saved { padding: 0.4rem 0.7rem 1rem; }
    #view-saved table { width: 100%; border-collapse: collapse; }
    #view-saved th, #view-saved td { text-align: left; padding: 0.55rem 0.35rem; border-bottom: 1px solid #eee; vertical-align: top; font-size: 0.95rem; }
    #view-saved th { color: var(--muted); font-weight: 650; }
    nav.app {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem;
      padding: 0.4rem max(0.6rem, env(safe-area-inset-right)) calc(0.4rem + env(safe-area-inset-bottom)) max(0.6rem, env(safe-area-inset-left));
      background: #fff; border-top: 1px solid #eee;
    }
    nav.app button {
      min-height: 48px; border: 0; border-radius: 10px; background: #f4f5f7;
      font-size: 16px; font-weight: 700; color: #111;
    }
    nav.app button.on { background: #111; color: #fff; }
    body.is-quiet header,
    body.is-quiet nav.app,
    body.is-quiet .install,
    body.is-quiet main { display: none !important; }
    #cornerDock[hidden] { display: none !important; }
    #cornerDock {
      position: fixed; z-index: 50;
      top: calc(0.55rem + env(safe-area-inset-top));
      right: max(0.55rem, env(safe-area-inset-right));
      display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem;
    }
    #cornerStatus, #cornerEnd {
      min-height: 40px; padding: 0 0.8rem; border: 0; border-radius: 999px;
      font: inherit; font-size: 14px; font-weight: 700;
    }
    #cornerStatus { background: #fff; color: #111; border: 1px solid #111; }
    #cornerStatus.on { background: #0a7a32; color: #fff; border-color: #0a7a32; }
    #cornerEnd { background: #111; color: #fff; }
    #stepSheet[hidden] { display: none !important; }
    #stepSheet {
      position: fixed; z-index: 45; left: 0; right: 0; bottom: 0;
      max-height: 72dvh; overflow: auto;
      padding: 0.8rem max(0.8rem, env(safe-area-inset-right)) calc(0.8rem + env(safe-area-inset-bottom)) max(0.8rem, env(safe-area-inset-left));
      background: #fff; border-top: 1px solid #e6e6e6; box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.08);
    }
    #stepSheet h2 { margin: 0 0 0.4rem; font-size: 1.05rem; }
    .step-row {
      display: grid; grid-template-columns: 1fr auto; gap: 0.35rem; align-items: center;
      padding: 0.45rem 0; border-bottom: 1px solid #f0f0f0;
    }
    .step-row button { min-height: 36px; border: 0; border-radius: 8px; background: #f4f5f7; font: inherit; font-weight: 650; }
    #stepSave, #stepClose {
      display: flex; align-items: center; justify-content: center; width: 100%;
      min-height: 48px; margin-top: 0.45rem; border: 0; border-radius: 12px;
      font: inherit; font-weight: 700;
    }
    #stepSave { background: #111; color: #fff; }
    #stepClose { background: #f4f5f7; color: #111; }
    #endVideo {
      position: fixed; width: 2px; height: 2px; left: 0; bottom: 0;
      opacity: 0.01; pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>fb-poller</h1>
    <p id="updateNote" hidden></p>
  </header>
  <p class="install" id="install">Bấm Chia sẻ, rồi Thêm vào Màn hình chính.
    <br /><button type="button" id="installHide">Đã hiểu</button>
  </p>
  <main>
    <section class="view" id="view-controls">
      <iframe id="controls" title="Điều khiển" src="/?as=iphone"></iframe>
    </section>
    <section class="view" id="view-saved" hidden>
      <table>
        <thead><tr><th>Tên</th><th>Tên trong danh bạ</th><th>Username</th></tr></thead>
        <tbody id="savedRows"><tr><td colspan="3">Chưa có người đã lưu.</td></tr></tbody>
      </table>
    </section>
  </main>
  <div id="cornerDock" data-norecord hidden>
    <button id="cornerStatus" type="button">Chưa ghi</button>
    <button id="cornerEnd" type="button">Kết thúc</button>
  </div>
  <section id="stepSheet" data-norecord hidden>
    <h2>Kịch bản</h2>
    <div id="stepList"></div>
    <button id="stepSave" type="button">Lưu các bước đã sửa</button>
    <button id="stepClose" type="button">Đóng</button>
  </section>
  <video id="endVideo" playsinline webkit-playsinline loop src="/static/ket-thuc.mp4"></video>
  <nav class="app">
    <button type="button" data-app="controls" class="on">Điều khiển</button>
    <button type="button" data-app="saved">Đã lưu</button>
  </nav>
  <script>
    const hubToken = __CONTROL_TOKEN_JSON__;
    if (hubToken) localStorage.setItem("fb_poller_control_token", hubToken);
  </script>
  <script src="/static/version.js"></script>
  <script src="/static/watch.js?v=__IPHONE_BUILD__"></script>
  <script>
    const install = document.getElementById("install");
    const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    if (standalone || localStorage.getItem("fb_poller_iphone_install") === "1") install.hidden = true;
    document.getElementById("installHide").addEventListener("click", () => {
      localStorage.setItem("fb_poller_iphone_install", "1");
      install.hidden = true;
    });
    const views = {
      controls: document.getElementById("view-controls"),
      saved: document.getElementById("view-saved"),
    };
    function showApp(name) {
      Object.entries(views).forEach(([key, node]) => { node.hidden = key !== name; });
      document.querySelectorAll("[data-app]").forEach((button) => {
        button.classList.toggle("on", button.getAttribute("data-app") === name);
      });
    }
    document.querySelectorAll("[data-app]").forEach((button) => {
      button.addEventListener("click", () => showApp(button.getAttribute("data-app")));
    });
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }
    function draw(items) {
      const rows = document.getElementById("savedRows");
      if (!items.length) {
        rows.innerHTML = "<tr><td colspan=\"3\">Chưa có người đã lưu.</td></tr>";
        return;
      }
      rows.innerHTML = items.map((person) =>
        "<tr><td>" + esc(person.name) + "</td><td>" + esc(person.contactName) + "</td><td>" + esc(person.username) + "</td></tr>"
      ).join("");
    }
    document.addEventListener("people-saved", (event) => draw(event.detail || []));
    document.addEventListener("people-auth", () => {
      document.getElementById("savedRows").innerHTML = "<tr><td colspan=\"3\">Chưa lưu được danh sách.</td></tr>";
    });
    (async function loadSaved() {
      const token = localStorage.getItem("fb_poller_control_token") || "";
      const headers = {};
      if (token) headers.Authorization = "Bearer " + token;
      const response = await fetch("/v1/people", { headers: headers });
      if (!response.ok) return;
      const data = await response.json();
      draw(data.items || []);
    })();

    const endVideo = document.getElementById("endVideo");
    const capture = { phase: "", t0: 0, events: [], press: null, steps: [] };
    let quietTimer = 0;
    let closing = false;
    let pipSeen = false;

    function authHeaders() {
      const token = localStorage.getItem("fb_poller_control_token") || "";
      const headers = { "Content-Type": "application/json" };
      if (token) headers.Authorization = "Bearer " + token;
      return headers;
    }

    function paintStatus() {
      const status = document.getElementById("cornerStatus");
      if (capture.phase !== "record") return;
      const count = capture.events.length;
      status.textContent = count ? "Đã ghi " + count : "Chưa ghi";
      status.classList.toggle("on", count > 0);
    }

    function closeFloat() {
      pipSeen = false;
      try {
        if (document.pictureInPictureElement === endVideo) document.exitPictureInPicture();
        if (endVideo.webkitPresentationMode === "picture-in-picture" && endVideo.webkitSetPresentationMode) {
          endVideo.webkitSetPresentationMode("inline");
        }
      } catch (error) {
        /* PiP đã đóng */
      }
      endVideo.pause();
    }

    function stopQuiet() {
      if (quietTimer) window.clearInterval(quietTimer);
      quietTimer = 0;
      capture.phase = "";
      capture.press = null;
      document.body.classList.remove("is-quiet");
      document.getElementById("cornerDock").hidden = true;
      document.getElementById("cornerStatus").classList.remove("on");
      document.getElementById("cornerStatus").textContent = "Chưa ghi";
      closeFloat();
      showApp("controls");
    }

    function floatEnd() {
      try {
        endVideo.muted = false;
        const playing = endVideo.play();
        if (typeof endVideo.webkitSetPresentationMode === "function") {
          endVideo.webkitSetPresentationMode("picture-in-picture");
        } else if (document.pictureInPictureEnabled && document.pictureInPictureElement !== endVideo) {
          const request = endVideo.requestPictureInPicture();
          if (request && typeof request.catch === "function") request.catch(() => {});
        }
        if (playing && typeof playing.then === "function") {
          playing.then(() => {
            const floating = endVideo.webkitPresentationMode === "picture-in-picture"
              || document.pictureInPictureElement === endVideo;
            if (!floating) endVideo.pause();
          }).catch(() => {});
        }
      } catch (error) {
        /* Nút Kết thúc trên trang vẫn bấm được */
      }
    }

    function startRecording() {
      capture.phase = "record";
      capture.t0 = performance.now();
      capture.events = [];
      capture.press = null;
      capture.steps = [];
      paintStatus();
      floatEnd();
    }

    function selectorOf(node) {
      if (!(node instanceof Element)) return "body";
      const withId = node.closest("[id]");
      if (!withId || withId.closest("[data-norecord]")) return "body";
      if (!/^[A-Za-z][A-Za-z0-9_-]{0,40}$/.test(withId.id)) return "body";
      return "#" + withId.id;
    }

    function renderSteps() {
      const root = document.getElementById("stepList");
      const save = document.getElementById("stepSave");
      root.replaceChildren();
      if (!capture.steps.length) {
        const empty = document.createElement("p");
        empty.textContent = "Chưa ghi được hành động nào. Chạm trên màn hình, rồi bấm Kết thúc.";
        root.appendChild(empty);
        save.hidden = true;
        return;
      }
      save.hidden = false;
      capture.steps.forEach((step, index) => {
        const row = document.createElement("div");
        row.className = "step-row";
        const label = document.createElement("div");
        label.textContent = (index + 1) + ". " + (step.caption || step.kind || "Bước");
        const actions = document.createElement("div");
        const up = document.createElement("button");
        up.type = "button";
        up.textContent = "Lên";
        up.disabled = index === 0;
        up.addEventListener("click", () => {
          const item = capture.steps.splice(index, 1)[0];
          capture.steps.splice(index - 1, 0, item);
          renderSteps();
        });
        const down = document.createElement("button");
        down.type = "button";
        down.textContent = "Xuống";
        down.disabled = index === capture.steps.length - 1;
        down.addEventListener("click", () => {
          const item = capture.steps.splice(index, 1)[0];
          capture.steps.splice(index + 1, 0, item);
          renderSteps();
        });
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Xoá";
        remove.addEventListener("click", () => {
          capture.steps.splice(index, 1);
          renderSteps();
        });
        actions.appendChild(up);
        actions.appendChild(down);
        actions.appendChild(remove);
        row.appendChild(label);
        row.appendChild(actions);
        root.appendChild(row);
      });
    }

    function showSheet() {
      document.body.classList.remove("is-quiet");
      document.getElementById("cornerDock").hidden = true;
      document.getElementById("stepSheet").hidden = false;
      showApp("controls");
    }

    async function finishRecording() {
      if (closing) return;
      closing = true;
      const events = capture.events.slice();
      capture.phase = "";
      capture.press = null;
      if (quietTimer) window.clearInterval(quietTimer);
      quietTimer = 0;
      closeFloat();
      showSheet();
      const list = document.getElementById("stepList");
      if (!events.length) {
        capture.steps = [];
        renderSteps();
        closing = false;
        return;
      }
      list.textContent = "Đang lưu và tách bước...";
      const headers = authHeaders();
      const saved = await fetch("/v1/recordings", {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ title: "Thao tác trên điện thoại", events: events }),
      });
      const parsed = await fetch("/v1/recordings/parse", {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ events: events }),
      });
      if (!saved.ok || !parsed.ok) {
        capture.steps = [];
        list.textContent = "Không lưu được. Mở lại trang rồi ghi tiếp.";
        document.getElementById("stepSave").hidden = true;
        closing = false;
        return;
      }
      capture.steps = (await parsed.json()).steps || [];
      renderSteps();
      closing = false;
    }

    function beginPhoneUse(delay) {
      if (capture.phase === "record") return;
      closing = false;
      if (quietTimer) window.clearInterval(quietTimer);
      quietTimer = 0;
      capture.events = [];
      capture.steps = [];
      document.getElementById("stepSheet").hidden = true;
      document.body.classList.add("is-quiet");
      document.getElementById("cornerDock").hidden = false;
      document.getElementById("cornerEnd").textContent = "Kết thúc";
      const status = document.getElementById("cornerStatus");
      status.classList.remove("on");
      if (!delay) {
        status.textContent = "Chưa ghi";
        startRecording();
        return;
      }
      capture.phase = "wait";
      const ends = Date.now() + 10000;
      status.textContent = "10";
      quietTimer = window.setInterval(() => {
        if (capture.phase !== "wait") {
          window.clearInterval(quietTimer);
          quietTimer = 0;
          return;
        }
        if (document.hidden) return;
        const left = Math.ceil((ends - Date.now()) / 1000);
        if (left > 0) {
          status.textContent = String(left);
          return;
        }
        window.clearInterval(quietTimer);
        quietTimer = 0;
        startRecording();
      }, 250);
    }
    window.beginPhoneUse = beginPhoneUse;

    document.getElementById("cornerStatus").addEventListener("click", (event) => {
      event.preventDefault();
    });
    document.getElementById("cornerEnd").addEventListener("click", () => {
      if (capture.phase === "record") finishRecording();
      else stopQuiet();
    });
    document.getElementById("stepClose").addEventListener("click", () => {
      document.getElementById("stepSheet").hidden = true;
      stopQuiet();
    });
    document.getElementById("stepSave").addEventListener("click", async () => {
      const save = document.getElementById("stepSave");
      if (!capture.steps.length) return;
      save.disabled = true;
      const response = await fetch("/v1/recordings/from-steps", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ title: "Thao tác trên điện thoại", steps: capture.steps }),
      });
      save.disabled = false;
      save.textContent = response.ok ? "Đã lưu kịch bản" : "Chưa lưu được";
    });
    document.addEventListener("pointerdown", (event) => {
      if (capture.phase !== "record") return;
      if (event.target instanceof Element && event.target.closest("[data-norecord]")) {
        capture.press = null;
        return;
      }
      capture.press = { id: event.pointerId, x: event.clientX, y: event.clientY };
    }, true);
    document.addEventListener("pointerup", (event) => {
      if (capture.phase !== "record" || !capture.press || event.pointerId !== capture.press.id) return;
      const start = capture.press;
      capture.press = null;
      if (event.target instanceof Element && event.target.closest("[data-norecord]")) return;
      const moved = Math.hypot(event.clientX - start.x, event.clientY - start.y);
      const t = Math.max(0, Math.round(performance.now() - capture.t0));
      if (moved > 36) {
        capture.events.push({
          t: t, kind: "pointer", phase: "up", target: "body",
          x: Math.round(event.clientX), y: Math.round(event.clientY),
          pointerType: "touch", click: false, intent: "swipe", label: "màn hình",
        });
        paintStatus();
        return;
      }
      const control = event.target instanceof Element ? event.target.closest("button, a") : null;
      const target = control ? selectorOf(control) : "body";
      const label = control
        ? (control.innerText || "").trim().replace(/\s+/g, " ").slice(0, 80)
        : "Màn hình";
      capture.events.push({
        t: t, kind: "pointer", phase: "up", target: target,
        x: Math.round(event.clientX), y: Math.round(event.clientY),
        pointerType: "touch", click: target !== "body", intent: "tap",
        label: label || "Màn hình",
        role: control ? (control.tagName === "A" ? "link" : "button") : undefined,
      });
      paintStatus();
    }, true);
    endVideo.addEventListener("leavepictureinpicture", () => {
      if (pipSeen && capture.phase === "record") finishRecording();
    });
    endVideo.addEventListener("webkitpresentationmodechanged", () => {
      if (endVideo.webkitPresentationMode === "picture-in-picture") {
        pipSeen = true;
        return;
      }
      if (pipSeen && capture.phase === "record") finishRecording();
    });
    window.addEventListener("message", (event) => {
      if (event.origin !== location.origin) return;
      const data = event.data || {};
      if (data.type !== "fb-arm") return;
      beginPhoneUse(Boolean(data.delay));
    });
  </script>
</body>
</html>
