<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="iphone-build" content="__IPHONE_BUILD__" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>fb-poller</title>
  <style>
    :root { --font: -apple-system, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: #111;
      background: #fff;
      font-size: 18px;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    #updateNote[hidden] { display: none !important; }
    #updateNote { margin: 0; padding: 0.7rem 1rem 0; color: #0a7a32; font-weight: 700; }
    main { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; padding: 1rem 1.1rem 0.6rem; }
    p.lead { margin: 0.2rem 0 0.8rem; line-height: 1.45; }
    p.lead a { color: #111; }
    #status { margin: 0 0 0.7rem; font-weight: 700; line-height: 1.4; }
    #status[hidden] { display: none !important; }
    #status.live { color: #b42318; }
    #playback { width: 100%; border-radius: 12px; background: #000; margin-bottom: 0.8rem; }
    #playback[hidden] { display: none !important; }
    #stepList { margin: 0.4rem 0 0; padding-left: 1.3rem; }
    #stepList li { margin: 0.55rem 0; }
    #peopleBox { margin-top: 1rem; }
    #peopleBox[hidden] { display: none !important; }
    #peopleLead { margin: 0 0 0.6rem; line-height: 1.4; }
    .person { border-bottom: 1px solid #ddd; padding: 0.65rem 0; }
    .person label { display: flex; gap: 0.6rem; align-items: flex-start; font-weight: 800; }
    .person p { margin: 0.2rem 0 0 1.8rem; }
    #savePeople {
      width: 100%; min-height: 52px; margin-top: 0.7rem;
      border-radius: 14px; border: 2px solid #111; background: #111; color: #fff;
      font: inherit; font-weight: 800;
    }
    #savePeople:disabled { opacity: 0.45; }
    #actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;
      padding: 0.7rem max(0.8rem, env(safe-area-inset-right)) calc(0.7rem + env(safe-area-inset-bottom)) max(0.8rem, env(safe-area-inset-left));
    }
    #recordBtn, #pick {
      display: flex; align-items: center; justify-content: center;
      min-height: 64px; border-radius: 16px; border: 2px solid #111;
      font: inherit; font-size: 18px; font-weight: 800; text-align: center;
    }
    #recordBtn { background: #111; color: #fff; }
    #recordBtn.live { background: #b42318; border-color: #b42318; }
    #pick { background: #fff; color: #111; }
    #pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    #recordBtn:disabled, #pick.busy { opacity: 0.45; }
  </style>
</head>
<body>
  <p id="updateNote" hidden></p>
  <main>
    <p class="lead">Bấm Bắt đầu ghi. Trang ghi màn hình liên tục và đọc tên, tài khoản, chữ nhìn thấy đến khi bạn bấm Dừng ghi. <a href="/cai-app">Cài app để đọc ứng dụng khác</a>.</p>
    <p id="status" hidden></p>
    <video id="playback" controls playsinline hidden></video>
    <ol id="stepList"></ol>
    <section id="peopleBox" hidden>
      <p id="peopleLead">Bỏ dòng đọc sai, rồi bấm Lưu thông tin. Cột đã có sẵn được giữ nguyên.</p>
      <div id="peopleBody"></div>
      <button id="savePeople" type="button">Lưu thông tin</button>
    </section>
  </main>
  <div id="actions">
    <button id="recordBtn" type="button">Bắt đầu ghi</button>
    <label id="pick">Chọn video
      <input id="videoFile" type="file" accept="video/*" />
    </label>
  </div>
  <script>
    const hubToken = __CONTROL_TOKEN_JSON__;
    if (hubToken) localStorage.setItem("fb_poller_control_token", hubToken);
  </script>
  <script src="/static/version.js"></script>
  <script src="/static/watch.js?v=__IPHONE_BUILD__"></script>
  <script>
    const pick = document.getElementById("pick");
    const fileInput = document.getElementById("videoFile");
    const recordBtn = document.getElementById("recordBtn");
    const list = document.getElementById("stepList");
    const peopleBox = document.getElementById("peopleBox");
    const peopleBody = document.getElementById("peopleBody");
    const savePeople = document.getElementById("savePeople");
    const playback = document.getElementById("playback");
    const status = document.getElementById("status");
    const SAMPLE_MS = 4000;
    const MAX_MS = 600000;
    let busy = false;
    let recording = false;
    let stopping = false;
    let sampling = false;
    let recorder = null;
    let stream = null;
    let chunks = [];
    let seen = [];
    let startedAt = 0;
    let stopTimer = 0;
    let sampleTimer = 0;
    let firstSample = 0;
    let playbackUrl = "";
    let closed = false;

    function authHeaders() {
      const headers = {};
      const token = localStorage.getItem("fb_poller_control_token") || "";
      if (token) headers.Authorization = "Bearer " + token;
      return headers;
    }

    function setStatus(text, live) {
      status.textContent = text || "";
      status.hidden = !text;
      status.classList.toggle("live", !!live);
    }

    function showMessage(text) {
      list.replaceChildren();
      const item = document.createElement("li");
      item.textContent = text;
      list.appendChild(item);
    }

    function renderSeen() {
      list.replaceChildren();
      seen.forEach((item) => {
        const row = document.createElement("li");
        row.textContent = item.caption;
        list.appendChild(row);
      });
    }

    function hidePeople() {
      peopleBody.replaceChildren();
      peopleBox.hidden = true;
    }

    function showPeople(rows) {
      peopleBody.replaceChildren();
      if (!rows || !rows.length) {
        peopleBox.hidden = true;
        return;
      }
      rows.forEach((row) => {
        const card = document.createElement("div");
        card.className = "person";
        const label = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = true;
        box.setAttribute("data-name", row.name || "");
        box.setAttribute("data-contact-name", row.contactName || "");
        box.setAttribute("data-username", row.username || "");
        const who = document.createElement("span");
        who.textContent = row.name || "";
        label.appendChild(box);
        label.appendChild(who);
        const contact = document.createElement("p");
        contact.textContent = "Tên danh bạ: " + (row.contactName || "");
        const account = document.createElement("p");
        account.textContent = "Tài khoản: " + (row.username || "");
        card.appendChild(label);
        card.appendChild(contact);
        card.appendChild(account);
        peopleBody.appendChild(card);
      });
      peopleBox.hidden = false;
    }

    function showSteps(steps) {
      seen = [];
      list.replaceChildren();
      if (!steps.length) {
        showMessage("Không đọc được chữ chắc. Để màn hình đứng yên lâu hơn rồi chọn lại.");
        return;
      }
      steps.forEach((step) => {
        const item = document.createElement("li");
        item.textContent = step.caption || "";
        list.appendChild(item);
      });
    }

    function showClip(file) {
      if (playbackUrl) URL.revokeObjectURL(playbackUrl);
      playback.srcObject = null;
      playbackUrl = URL.createObjectURL(file);
      playback.hidden = false;
      playback.muted = false;
      playback.src = playbackUrl;
    }

    function screenCapture() {
      const devices = navigator.mediaDevices;
      if (!window.isSecureContext || !devices || typeof devices.getDisplayMedia !== "function") return null;
      return devices;
    }

    function clockLabel() {
      const total = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
      return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
    }

    function addLine(line) {
      const body = (line || "").trim();
      if (!body || seen.length >= 20) return;
      for (let index = 0; index < seen.length; index += 1) {
        const previous = seen[index].body;
        if (previous === body || previous.includes(body)) return;
        if (body.includes(previous)) {
          seen[index] = { body: body, caption: clockLabel() + " — " + body };
          renderSeen();
          return;
        }
      }
      seen.push({ body: body, caption: clockLabel() + " — " + body });
      renderSeen();
    }

    async function sendVideo(file) {
      busy = true;
      pick.classList.add("busy");
      recordBtn.disabled = true;
      setStatus("Đang đọc chữ trên màn hình...", false);
      hidePeople();
      const body = new FormData();
      body.append("file", file, file.name || "man-hinh.mp4");
      let response;
      try {
        response = await fetch("/v1/recordings/from-video", { method: "POST", headers: authHeaders(), body: body });
      } catch (error) {
        setStatus("", false);
        showMessage("Chưa gửi được video. Mở lại trang rồi chọn lại.");
        pick.classList.remove("busy");
        recordBtn.disabled = false;
        busy = false;
        return;
      }
      if (!response.ok) {
        setStatus("", false);
        showMessage("Chưa đọc được video. Chọn đúng bản ghi màn hình.");
        pick.classList.remove("busy");
        recordBtn.disabled = false;
        busy = false;
        return;
      }
      const data = await response.json();
      const people = data.people || [];
      setStatus(people.length ? "Đã đọc. Bỏ dòng sai rồi bấm Lưu thông tin." : "", false);
      showSteps(data.steps || []);
      showPeople(people);
      pick.classList.remove("busy");
      recordBtn.disabled = false;
      busy = false;
    }

    function stopTracks() {
      if (!stream) return;
      stream.getTracks().forEach((track) => track.stop());
      stream = null;
    }

    function frameBlob() {
      const width = playback.videoWidth;
      const height = playback.videoHeight;
      if (!width || !height) return Promise.resolve(null);
      const target = Math.min(720, width);
      const canvas = document.createElement("canvas");
      canvas.width = target;
      canvas.height = Math.max(1, Math.round(height * (target / width)));
      const context = canvas.getContext("2d");
      if (!context) return Promise.resolve(null);
      context.drawImage(playback, 0, 0, canvas.width, canvas.height);
      return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.72));
    }

    async function sampleFrame() {
      if (!recording || sampling) return;
      const blob = await frameBlob();
      if (!blob || !recording) return;
      sampling = true;
      const body = new FormData();
      body.append("file", blob, "khung.jpg");
      try {
        const response = await fetch("/v1/recordings/from-frame", { method: "POST", headers: authHeaders(), body: body });
        if (response.ok && recording) {
          const data = await response.json();
          addLine(data.line || "");
        }
      } catch (error) {
        // Keep the recording running if one frame fails to send.
      } finally {
        sampling = false;
      }
    }

    async function saveSeen() {
      if (!seen.length) return false;
      const response = await fetch("/v1/recordings/seen", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
        body: JSON.stringify({ lines: seen.map((item) => item.caption) }),
      });
      return response.ok;
    }

    async function finishRecording() {
      if (closed) return;
      closed = true;
      recording = false;
      stopping = true;
      window.clearTimeout(stopTimer);
      window.clearTimeout(firstSample);
      window.clearInterval(sampleTimer);
      const type = (recorder && recorder.mimeType) || "video/webm";
      const blob = new Blob(chunks, { type: type });
      recorder = null;
      chunks = [];
      playback.srcObject = null;
      stopTracks();
      recordBtn.textContent = "Bắt đầu ghi";
      recordBtn.classList.remove("live");
      setStatus("Đang lưu chữ đã đọc...", false);
      if (seen.length) {
        let stored = false;
        try {
          stored = await saveSeen();
        } catch (error) {
          stored = false;
        }
        renderSeen();
        if (blob.size) showClip(blob);
        setStatus(stored ? "" : "Đã đọc trên máy này. Chưa lưu được lên hub.", false);
        stopping = false;
        return;
      }
      stopping = false;
      if (!blob.size) {
        setStatus("", false);
        showMessage("Bản quay trống. Thử lại.");
        return;
      }
      const ext = type.includes("mp4") ? "mp4" : "webm";
      const file = new File([blob], "man-hinh." + ext, { type: type });
      showClip(file);
      await sendVideo(file);
    }

    function stopRecording() {
      if (!recording || stopping) return;
      stopping = true;
      recording = false;
      window.clearTimeout(stopTimer);
      window.clearTimeout(firstSample);
      window.clearInterval(sampleTimer);
      if (recorder && recorder.state === "recording") {
        recorder.stop();
        return;
      }
      finishRecording();
    }

    async function startRecording() {
      if (busy || recording) return;
      const devices = screenCapture();
      if (!devices) {
        setStatus("Trang web không đọc được ứng dụng khác. Bấm Cài app, cài fb-poller lên iPhone, rồi bấm Bắt đầu ghi trong app.", false);
        return;
      }
      try {
        stream = await devices.getDisplayMedia({ video: { frameRate: 5 }, audio: false });
      } catch (error) {
        setStatus("Chưa bật được ghi hình. Cho phép chia sẻ màn hình, hoặc ghi ở Trung tâm điều khiển rồi chọn video.", false);
        return;
      }
      const mime = ["video/webm;codecs=vp8", "video/webm", "video/mp4"].find((type) => {
        return window.MediaRecorder && MediaRecorder.isTypeSupported(type);
      }) || "";
      chunks = [];
      seen = [];
      hidePeople();
      startedAt = Date.now();
      recording = true;
      stopping = false;
      closed = false;
      try {
        recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        recorder.ondataavailable = (event) => {
          if (event.data && event.data.size) chunks.push(event.data);
        };
        recorder.onstop = () => { finishRecording(); };
        stream.getVideoTracks().forEach((track) => {
          track.onended = () => {
            if (recording && !stopping) stopRecording();
          };
        });
        recorder.start(1000);
      } catch (error) {
        recording = false;
        closed = true;
        recorder = null;
        stopTracks();
        setStatus("Chưa bật được ghi hình. Cho phép chia sẻ màn hình, hoặc ghi ở Trung tâm điều khiển rồi chọn video.", false);
        return;
      }
      playback.hidden = false;
      playback.srcObject = stream;
      playback.muted = true;
      try { await playback.play(); } catch (error) { /* The frame sampler retries until a frame exists. */ }
      recordBtn.textContent = "Dừng ghi";
      recordBtn.classList.add("live");
      list.replaceChildren();
      setStatus("Đang ghi liên tục. Bấm Dừng ghi khi xong.", true);
      sampleTimer = window.setInterval(sampleFrame, SAMPLE_MS);
      firstSample = window.setTimeout(sampleFrame, 1200);
      stopTimer = window.setTimeout(stopRecording, MAX_MS);
    }

    recordBtn.addEventListener("click", () => {
      if (recording) stopRecording();
      else startRecording();
    });

    savePeople.addEventListener("click", async () => {
      const chosen = Array.from(peopleBody.querySelectorAll("input[type=checkbox]")).filter((box) => box.checked);
      if (!chosen.length) {
        setStatus("Chưa chọn dòng nào.", false);
        return;
      }
      const rows = chosen.map((box) => ({
        name: box.getAttribute("data-name") || "",
        contactName: box.getAttribute("data-contact-name") || "",
        username: box.getAttribute("data-username") || "",
      }));
      savePeople.disabled = true;
      let response;
      try {
        response = await fetch("/v1/people/confirm", {
          method: "POST",
          headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
          body: JSON.stringify({ rows: rows }),
        });
      } catch (error) {
        savePeople.disabled = false;
        setStatus("Chưa lưu được. Mở lại trang rồi bấm Lưu thông tin.", false);
        return;
      }
      savePeople.disabled = false;
      if (!response.ok) {
        setStatus("Chưa lưu được. Mở lại trang rồi bấm Lưu thông tin.", false);
        return;
      }
      const data = await response.json();
      setStatus(data.saved ? "Đã lưu thông tin." : "Cột đã có sẵn được giữ nguyên.", false);
    });

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = "";
      if (!file || busy || recording) return;
      showClip(file);
      await sendVideo(file);
    });
  </script>
</body>
</html>
