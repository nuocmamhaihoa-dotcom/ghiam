<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Danh bạ" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="danhba-build" content="10" />
  <link rel="manifest" href="/danhba/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Danh bạ</title>
  <style>
    :root { --font: -apple-system, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--font); font-size: 16px; color: #111; background: #fff;
      padding: calc(1rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) calc(9.5rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    h2 { font-size: 1rem; margin: 1rem 0 0.4rem; }
    p { margin: 0 0 0.8rem; line-height: 1.4; }
    label { display: block; font-weight: 650; margin: 0 0 0.35rem; }
    label.check { display: flex; align-items: flex-start; gap: 0.6rem; font-weight: 650; }
    label.check input { width: 1.25rem; height: 1.25rem; margin-top: 0.15rem; }
    input, textarea {
      width: 100%; font: inherit; color: inherit; border: 1px solid #d5d8de; border-radius: 12px;
      padding: 0.75rem 0.8rem; background: #fff;
    }
    textarea { min-height: 140px; resize: vertical; }
    label.check input { width: 1.25rem; height: 1.25rem; margin-top: 0.15rem; }
    html.on-hub #local, html:not(.on-hub) #hub, html:not(.on-hub) #sync { display: none; }
    button, a.btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 48px; margin: 0 0 0.55rem;
      border: 0; border-radius: 12px; font-size: 16px; font-weight: 700;
      text-decoration: none; color: #fff; background: #111;
    }
    button.ghost, a.ghost { background: #f4f5f7; color: #111; }
    button:disabled, a.btn[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
    .hint, .build { color: #5c6570; }
    .card {
      margin: 0 0 0.55rem; padding: 0.75rem 0.8rem; border-radius: 12px; background: #f4f5f7;
      display: flex; justify-content: space-between; gap: 0.6rem; text-align: left; font-weight: 650;
    }
    .card.active { outline: 2px solid #111; }
    .note {
      padding: 0.75rem 0.8rem; border-radius: 12px; background: #f4f5f7; margin: 0 0 0.8rem;
    }
    .note.error { background: #fde8e8; }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 0.6rem max(1rem, env(safe-area-inset-right)) calc(0.6rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
    }
    #syncFile, #file { display: none; }
  </style>
  <script>document.documentElement.classList.toggle("on-hub", location.pathname === "/danhba" || location.pathname.indexOf("/danhba/") === 0);</script>
</head>
<body>
  <h1>Danh bạ</h1>
  <p class="hint" id="install">Dán danh sách, rồi bấm Nạp lên iPhone. Thẻ chỉ hiện số đầu. Đừng bấm Tạo liên hệ mới. Bấm nút chia sẻ góc trên bên phải, chọn Danh bạ, rồi Thêm tất cả. Mỗi danh bạ tối đa 5000 số.</p>
  <p class="note" id="upgrade" hidden>Có bản mới trên hub.</p>
  <p id="status" class="hint">Dán số, rồi bấm Nạp lên iPhone.</p>
  <div id="local">
    <label for="title">Tên danh bạ</label>
    <input id="title" value="Khach" autocomplete="off" />
    <label for="numbers">Danh sách số</label>
    <textarea id="numbers" placeholder="0901234567"></textarea>
    <button id="pick" class="ghost" type="button">Chọn file</button>
    <input id="file" type="file" accept=".txt,.csv,.vcf,.vcard,text/plain,text/vcard,text/x-vcard" />
    <div id="localBooks"></div>
  </div>
  <div id="hub">
    <label for="token">Token hub</label>
    <input id="token" type="password" autocomplete="off" />
    <label class="check" for="full"><input id="full" type="checkbox" /> File này là toàn bộ danh bạ trên iPhone</label>
    <h2>Chưa dùng</h2>
    <div id="ready"></div>
    <h2>Đã dùng</h2>
    <div id="used"></div>
  </div>
  <p id="message" class="note" hidden></p>
  <p class="build" id="buildLine">Phiên bản 10</p>
  <div class="bar">
    <a id="go" class="btn" href="#">Nạp lên iPhone</a>
    <button id="sync" class="ghost" type="button">Đối chiếu iPhone</button>
  </div>
  <input id="syncFile" type="file" accept=".vcf,.vcard,.txt,text/vcard,text/x-vcard,text/plain" />
  <script>
    window.DANHBA_BUILD = 10;
  </script>
  <script>
(function (root) {
  var MAX_DRAFTS = 100000;
  var PAGE_SIZE = 5000;
  var HEADER_WORDS = {
    name: true,
    ten: true,
    "tên": true,
    "ho ten": true,
    "họ tên": true,
    hoten: true,
    "họ và tên": true,
    phone: true,
    sdt: true,
    "sđt": true,
    "so dien thoai": true,
    "số điện thoại": true,
    tel: true,
    mobile: true,
    "điện thoại": true
  };

  function cleanName(value) {
    var collapsed = String(value || "").split(/\s+/).filter(Boolean).join(" ");
    return collapsed.length <= 80 ? collapsed : collapsed.slice(0, 80);
  }

  function nameKey(value) {
    return cleanName(value).toLowerCase();
  }

  function cleanTitle(raw) {
    var collapsed = String(raw || "").split(/\s+/).filter(Boolean).join(" ");
    if (!collapsed) return "";
    return collapsed.slice(0, 40);
  }

  function normalizePhone(raw) {
    var text = String(raw || "").trim();
    if (text.toLowerCase().indexOf("tel:") === 0) {
      text = text.slice(4).trim();
    }
    if (!text) return null;
    var digits = "";
    var leadingPlus = false;
    var started = false;
    for (var i = 0; i < text.length; i += 1) {
      var character = text.charAt(i);
      if (!started && character === "+") {
        leadingPlus = true;
        started = true;
        continue;
      }
      started = true;
      if (character >= "0" && character <= "9") {
        digits += character;
        continue;
      }
      if (character === " " || character === "-" || character === "(" || character === ")" || character === "." || character === "\t") {
        continue;
      }
      break;
    }
    if (digits.length < 8 || digits.length > 15) return null;
    if (digits.length === 11 && digits.indexOf("84") === 0) {
      return "0" + digits.slice(2);
    }
    return leadingPlus ? "+" + digits : digits;
  }

  function splitCSV(line) {
    var fields = [];
    var current = "";
    var inQuotes = false;
    var index = 0;
    while (index < line.length) {
      var character = line.charAt(index);
      if (inQuotes) {
        if (character === "\"") {
          if (line.charAt(index + 1) === "\"") {
            current += "\"";
            index += 2;
            continue;
          }
          inQuotes = false;
        } else {
          current += character;
        }
      } else if (character === "\"" && current === "") {
        inQuotes = true;
      } else if (character === "," || character === ";" || character === "\t") {
        fields.push(current.trim());
        current = "";
      } else {
        current += character;
      }
      index += 1;
    }
    fields.push(current.trim());
    return fields;
  }

  function isHeader(fields) {
    if (fields.length < 2) return false;
    for (var i = 0; i < fields.length; i += 1) {
      if (!HEADER_WORDS[nameKey(fields[i])]) return false;
    }
    return true;
  }

  function draftsFromLine(line, fields) {
    var phones = [];
    var nameParts = [];
    var i;
    for (i = 0; i < fields.length; i += 1) {
      var phone = normalizePhone(fields[i]);
      if (phone) phones.push(phone);
      else {
        var piece = cleanName(fields[i]);
        if (piece) nameParts.push(piece);
      }
    }
    if (!phones.length) {
      var parts = line.split(/\s+/).filter(Boolean);
      if (parts.length >= 2) {
        var tail = normalizePhone(parts[parts.length - 1]);
        var head = cleanName(parts.slice(0, -1).join(" "));
        if (tail && head) return [{ name: head, phone: tail }];
      }
      var whole = normalizePhone(line);
      if (whole) return [{ name: whole, phone: whole }];
      var onlyName = cleanName(fields.join(" "));
      return onlyName ? [{ name: onlyName, phone: null }] : [];
    }
    var name = nameParts.join(" ");
    return phones.map(function (phone) {
      return { name: name || phone, phone: phone };
    });
  }

  function parseLines(text) {
    var lines = String(text || "").replace(/^\uFEFF/, "").split(/\r\n|\n|\r/);
    var raw = [];
    var extra = false;
    for (var index = 0; index < lines.length; index += 1) {
      if (index >= 100000) {
        extra = true;
        break;
      }
      var trimmed = lines[index].trim();
      if (!trimmed || trimmed.charAt(0) === "#") continue;
      var fields = splitCSV(trimmed);
      if (isHeader(fields)) continue;
      raw = raw.concat(draftsFromLine(trimmed, fields));
    }
    var seen = {};
    var drafts = [];
    var truncated = extra;
    for (var j = 0; j < raw.length; j += 1) {
      var key = nameKey(raw[j].name) + "|" + (raw[j].phone || "");
      if (seen[key]) continue;
      if (drafts.length >= MAX_DRAFTS) {
        truncated = true;
        break;
      }
      seen[key] = true;
      drafts.push(raw[j]);
    }
    return { drafts: drafts, truncated: truncated };
  }

  function split(drafts, title, pageSize) {
    var base = cleanTitle(title);
    var size = pageSize || PAGE_SIZE;
    if (!base || size < 1) return null;
    var seen = {};
    var pages = [];
    var current = [];
    var duplicatePhones = 0;
    for (var i = 0; i < drafts.length; i += 1) {
      var phone = drafts[i].phone;
      if (!phone) continue;
      if (seen[phone]) {
        duplicatePhones += 1;
        continue;
      }
      seen[phone] = true;
      if (current.length === size) {
        pages.push(current);
        current = [];
      }
      current.push({ name: drafts[i].name, phone: phone });
    }
    if (current.length) pages.push(current);
    var books = pages.map(function (entries, index) {
      return {
        id: "book-" + (index + 1) + "-" + base,
        name: base + " " + (index + 1),
        entries: entries,
        sent: false
      };
    });
    return { books: books, duplicatePhones: duplicatePhones };
  }

  function phonesAreUnique(books) {
    var seen = {};
    for (var i = 0; i < books.length; i += 1) {
      var entries = books[i].entries || [];
      for (var j = 0; j < entries.length; j += 1) {
        if (seen[entries[j].phone]) return false;
        seen[entries[j].phone] = true;
      }
    }
    return true;
  }

  function escapeValue(value) {
    return String(value || "")
      .replace(/\\/g, "\\\\")
      .replace(/\n/g, "\\n")
      .replace(/,/g, "\\,")
      .replace(/;/g, "\\;");
  }

  function vcard(book) {
    var lines = [];
    var entries = book.entries || [];
    for (var i = 0; i < entries.length; i += 1) {
      var name = escapeValue(entries[i].name || entries[i].phone);
      var group = escapeValue(book.name);
      lines.push("BEGIN:VCARD");
      lines.push("VERSION:3.0");
      lines.push("N:" + name + ";;;;");
      lines.push("FN:" + name);
      lines.push("ORG:" + group);
      lines.push("TEL;TYPE=CELL:" + entries[i].phone);
      lines.push("NOTE:" + group + ". " + escapeValue("Bấm nút chia sẻ góc trên. Chọn Danh bạ. Bấm Thêm tất cả."));
      lines.push("END:VCARD");
    }
    return lines.join("\r\n") + "\r\n";
  }

  root.DanhBa = {
    pageSize: PAGE_SIZE,
    cleanTitle: cleanTitle,
    normalizePhone: normalizePhone,
    parseLines: parseLines,
    split: split,
    phonesAreUnique: phonesAreUnique,
    vcard: vcard
  };
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
  <script>
    var BUILD = window.DANHBA_BUILD;
    var onHub = location.pathname === "/danhba" || location.pathname.indexOf("/danhba/") === 0;
    var tokenInput = document.getElementById("token");
    var statusLine = document.getElementById("status");
    var message = document.getElementById("message");
    var readyBox = document.getElementById("ready");
    var usedBox = document.getElementById("used");
    var goButton = document.getElementById("go");
    var syncButton = document.getElementById("sync");
    var syncFile = document.getElementById("syncFile");
    var fullInput = document.getElementById("full");
    var numbersInput = document.getElementById("numbers");
    var titleInput = document.getElementById("title");
    var localBooks = document.getElementById("localBooks");
    var fileInput = document.getElementById("file");
    var books = { ready: [], used: [] };
    var activeId = null;
    var running = false;
    var revision = "";
    var loaded = false;
    var sentLocal = {};
    if (tokenInput) tokenInput.value = localStorage.getItem("fb_poller_control_token") || "";

    function showMessage(text, isError) {
      message.hidden = !text;
      message.textContent = text || "";
      message.className = isError ? "note error" : "note";
    }

    function authHeaders() {
      var headers = { Accept: "application/json" };
      var token = tokenInput.value.trim();
      if (token) headers.Authorization = "Bearer " + token;
      return headers;
    }

    function rememberToken() {
      localStorage.setItem("fb_poller_control_token", tokenInput.value.trim());
    }

    function card(book, box, current) {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "card" + (book.id === current ? " active" : "");
      var name = document.createElement("span");
      name.textContent = book.name + " · " + book.count + " số";
      var mark = document.createElement("span");
      mark.textContent = book.status === "used" ? "Đã dùng" : "Chưa dùng";
      button.appendChild(name);
      button.appendChild(mark);
      if (book.status !== "used") {
        button.addEventListener("click", function () {
          activeId = book.id;
          render();
        });
      }
      box.appendChild(button);
    }

    function render() {
      var ready = books.ready || [];
      var used = books.used || [];
      activeId = ready.length ? (activeId || ready[0].id) : null;
      var known = false;
      for (var i = 0; i < ready.length; i += 1) {
        if (ready[i].id === activeId) known = true;
      }
      if (!known) activeId = ready.length ? ready[0].id : null;
      statusLine.textContent = ready.length
        ? ready.length + " danh bạ chưa dùng. Bấm Nạp lên iPhone. Trên thẻ bấm nút chia sẻ góc trên, chọn Danh bạ, rồi Thêm tất cả."
        : "Chưa có danh bạ chờ. Nạp danh sách từ máy tính.";
      goButton.setAttribute("aria-disabled", loaded && !ready.length ? "true" : "false");
      goButton.textContent = "Nạp lên iPhone";
      readyBox.textContent = "";
      usedBox.textContent = "";
      if (!ready.length) readyBox.textContent = "Chưa có danh bạ.";
      ready.forEach(function (book) { card(book, readyBox, activeId); });
      if (!used.length) usedBox.textContent = "Chưa có danh bạ đã dùng.";
      used.forEach(function (book) { card(book, usedBox, null); });
    }

    function applyBooks(payload, force) {
      var next = (payload && payload.revision) || "";
      if (!force && next && next === revision) return;
      revision = next;
      loaded = true;
      books = payload || { ready: [], used: [] };
      render();
    }

    async function refresh(force) {
      if (!onHub || (running && !force)) return;
      var response = await fetch("/v1/danhba/books", { headers: authHeaders(), cache: "no-store" });
      if (response.status === 401) {
        showMessage("Dán token hub, rồi bấm Nạp lên iPhone.", true);
        revision = "";
        books = { ready: [], used: [] };
        render();
        return;
      }
      if (!response.ok) {
        showMessage("Không lấy được danh bạ trên hub.", true);
        render();
        return;
      }
      rememberToken();
      applyBooks(await response.json(), force);
    }

    async function loadAll() {
      var headers = authHeaders();
      headers["Content-Type"] = "application/json";
      var response = await fetch("/v1/danhba/xuat", {
        method: "POST",
        headers: headers,
        body: "{}"
      });
      if (response.status === 401) {
        showMessage("Dán token hub, rồi bấm Nạp lên iPhone.", true);
        return;
      }
      var payload = await response.json();
      if (!response.ok || !payload.url) {
        showMessage(payload.detail || "Chưa có danh bạ chờ.", true);
        return;
      }
      rememberToken();
      window.location.assign(payload.url);
    }

    function draftsFromInput(text) {
      var source = String(text || "");
      if (source.toUpperCase().indexOf("BEGIN:VCARD") === -1) return DanhBa.parseLines(source);
      var unfolded = source.replace(/\r\n/g, "\n").replace(/\r/g, "\n").replace(/\n[ \t]/g, "");
      var drafts = [];
      var name = "";
      unfolded.split("\n").forEach(function (line) {
        if (line.indexOf("FN:") === 0) name = line.slice(3).trim();
        var tel = line.match(/^(?:[A-Za-z0-9-]+\.)?TEL(?:;[^:]*)?:(.*)$/i);
        if (!tel) return;
        var phone = DanhBa.normalizePhone(tel[1]);
        if (!phone) return;
        drafts.push({ name: name || phone, phone: phone });
        name = "";
      });
      return { drafts: drafts, truncated: false };
    }

    function localSplit() {
      var parsed = draftsFromInput(numbersInput.value);
      var title = DanhBa.cleanTitle(titleInput.value) || "Khach";
      return DanhBa.split(parsed.drafts, title, DanhBa.pageSize);
    }

    function renderLocal() {
      var split = localSplit();
      var list = (split && split.books) || [];
      statusLine.textContent = list.length
        ? "Đã chia " + list.length + " danh bạ, mỗi cuốn tối đa 5000 số. Mỗi số chỉ nằm trong một danh bạ."
        : "Dán số, rồi bấm Nạp lên iPhone.";
      localBooks.textContent = "";
      list.forEach(function (book) {
        var row = document.createElement("div");
        row.className = "card";
        var name = document.createElement("span");
        name.textContent = book.name + " · " + book.entries.length + " số";
        var mark = document.createElement("span");
        mark.textContent = "Chưa nạp";
        row.appendChild(name);
        row.appendChild(mark);
        localBooks.appendChild(row);
      });
      goButton.setAttribute("aria-disabled", "false");
      goButton.textContent = "Nạp lên iPhone";
    }

    var armedBody = "";
    var armedUrl = "";

    function pendingCard() {
      var split = localSplit();
      var list = (split && split.books) || [];
      if (!list.length) return null;
      var pending = list.filter(function (book) { return !sentLocal[book.id]; });
      if (!pending.length) pending = list;
      var body = "";
      var opened = [];
      for (var i = 0; i < pending.length; i += 1) {
        var cardBody = DanhBa.vcard(pending[i]);
        if (body && body.length + cardBody.length > 900000) break;
        body += cardBody;
        opened.push(pending[i]);
      }
      if (!body) return null;
      return {
        body: body,
        opened: opened
      };
    }

    function armLocalCard() {
      var prepared = pendingCard();
      if (!prepared) {
        goButton.href = "#";
        goButton.removeAttribute("download");
        return null;
      }
      if (prepared.body !== armedBody) {
        armedBody = prepared.body;
        armedUrl = URL.createObjectURL(new Blob([prepared.body], { type: "text/x-vcard" }));
      }
      goButton.href = armedUrl;
      goButton.removeAttribute("download");
      return prepared;
    }

    function importHint(count) {
      if (count > 1) {
        return "Thẻ này chỉ hiện số đầu trong " + count + " số. Bấm nút chia sẻ góc trên bên phải, chọn Danh bạ, rồi Thêm tất cả. Nút Tạo liên hệ mới chỉ lưu 1 số.";
      }
      return "Trên thẻ iPhone bấm Tạo liên hệ mới, rồi dấu tick xanh.";
    }

    function openCard() {
      var prepared = armLocalCard();
      if (!prepared) {
        showMessage("Dán số hoặc chọn file.", true);
        renderLocal();
        return;
      }
      var count = prepared.opened.reduce(function (sum, book) { return sum + book.entries.length; }, 0);
      showMessage(importHint(count), false);
      window.location.assign(armedUrl);
    }

    function blurField() {
      var active = document.activeElement;
      if (active && active !== goButton && typeof active.blur === "function") active.blur();
    }

    function syncSummary(payload) {
      var text = "Đã đối chiếu " + payload.seenPhones + " số.";
      if (payload.movedToUsed) text += " Chuyển " + payload.movedToUsed + " danh bạ sang Đã dùng.";
      if (payload.movedToReady) text += " Trả " + payload.movedToReady + " danh bạ về Chưa dùng.";
      if (!payload.movedToUsed && !payload.movedToReady) text += " Chưa có danh bạ nào khớp đủ số.";
      if (payload.unknownPhones) text += " " + payload.unknownPhones + " số trên máy không có trong hub.";
      return text;
    }

    async function reconcile(text) {
      var headers = authHeaders();
      headers["Content-Type"] = "application/json";
      var response = await fetch("/v1/danhba/sync", {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ text: text, full: fullInput.checked })
      });
      if (response.status === 401) {
        showMessage("Dán token hub, rồi bấm Đối chiếu iPhone.", true);
        return;
      }
      var payload = await response.json();
      if (!response.ok) {
        showMessage(payload.detail || "Không đối chiếu được.", true);
        return;
      }
      rememberToken();
      showMessage(syncSummary(payload), false);
      applyBooks(payload, true);
    }

    goButton.addEventListener("touchstart", function () {
      blurField();
      if (!onHub) armLocalCard();
    }, { passive: true });
    goButton.addEventListener("pointerdown", function () {
      blurField();
      if (!onHub) armLocalCard();
    });
    goButton.addEventListener("click", function (event) {
      event.preventDefault();
      if (running || goButton.getAttribute("aria-disabled") === "true") return;
      blurField();
      if (!onHub) {
        openCard();
        return;
      }
      rememberToken();
      running = true;
      loadAll().then(function () {
        running = false;
      }, function () {
        running = false;
        showMessage("Không nạp được danh bạ.", true);
      });
    });

    document.getElementById("pick").addEventListener("click", function () {
      fileInput.click();
    });
    fileInput.addEventListener("change", function (event) {
      var file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file) return;
      if (file.size > 12000000) {
        showMessage("File quá lớn.", true);
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        numbersInput.value = String(reader.result || "");
        renderLocal();
        armLocalCard();
      };
      reader.onerror = function () {
        showMessage("Không mở được file.", true);
      };
      reader.readAsText(file);
    });
    numbersInput.addEventListener("paste", function (event) {
      if (onHub) return;
      var clip = event.clipboardData ? event.clipboardData.getData("text") : "";
      if (!clip) return;
      event.preventDefault();
      var start = numbersInput.selectionStart;
      var end = numbersInput.selectionEnd;
      if (start == null) start = numbersInput.value.length;
      if (end == null) end = start;
      numbersInput.value = numbersInput.value.slice(0, start) + clip + numbersInput.value.slice(end);
      renderLocal();
      var prepared = armLocalCard();
      if (!prepared) {
        showMessage("Không thấy số điện thoại trong phần vừa dán.", true);
        return;
      }
      var count = prepared.opened.reduce(function (sum, book) { return sum + book.entries.length; }, 0);
      showMessage("Đã nhận " + count + " số. Bấm Nạp lên iPhone. Trên thẻ đừng bấm Tạo liên hệ mới.", false);
    });
    numbersInput.addEventListener("input", function () {
      renderLocal();
      armLocalCard();
    });
    titleInput.addEventListener("input", function () {
      renderLocal();
      armLocalCard();
    });

    syncButton.addEventListener("click", function () {
      if (running) return;
      syncFile.click();
    });
    syncFile.addEventListener("change", function (event) {
      var file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file || running) return;
      if (file.size > 20000000) {
        showMessage("File quá lớn.", true);
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        running = true;
        reconcile(String(reader.result || "")).then(function () {
          running = false;
        }, function () {
          running = false;
          showMessage("Không đối chiếu được.", true);
        });
      };
      reader.onerror = function () {
        showMessage("Không mở được file.", true);
      };
      reader.readAsText(file);
    });

    if (onHub && "serviceWorker" in navigator) {
      var reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
      navigator.serviceWorker.register("/danhba/sw.js", { scope: "/danhba/" }).then(function (registration) {
        registration.update();
      }).catch(function () {});
    }

    if (onHub) fetch("/danhba/version", { cache: "no-store" }).then(function (response) {
      return response.json();
    }).then(function (info) {
      if (!info || info.build === BUILD) return;
      var current = new URL(location.href);
      if (current.searchParams.get("v") === String(info.build)) {
        var upgrade = document.getElementById("upgrade");
        upgrade.hidden = false;
        var update = document.createElement("button");
        update.type = "button";
        update.textContent = "Cập nhật";
        update.addEventListener("click", function () {
          current.searchParams.set("v", String(Date.now()));
          location.replace(current.toString());
        });
        upgrade.appendChild(update);
        return;
      }
      current.searchParams.set("v", String(info.build));
      location.replace(current.toString());
    }).catch(function () {});

    if (onHub) {
      document.getElementById("install").textContent = "Bấm Nạp lên iPhone để mở tệp cả danh bạ. Trên thẻ bấm nút chia sẻ góc trên, chọn Danh bạ, rồi Thêm tất cả.";
      render();
      refresh(true);
    } else {
      try { localStorage.removeItem("danhbaShortcutReady"); } catch (err) {}
      renderLocal();
      armLocalCard();
      window.addEventListener("pageshow", function () {
        if (!numbersInput.value.trim()) return;
        var prepared = armLocalCard();
        if (!prepared) return;
        showMessage(importHint(prepared.opened.reduce(function (sum, book) { return sum + book.entries.length; }, 0)), false);
      });
    }
    if (onHub) {
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) refresh(false);
      });
      setInterval(function () {
        refresh(false);
      }, 5000);
    }
  </script>
</body>
</html>
