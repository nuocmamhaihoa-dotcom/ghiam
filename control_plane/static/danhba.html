<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Danh bạ" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="danhba-build" content="3" />
  <link rel="manifest" href="/danhba/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Danh bạ</title>
  <style>
    :root { --font: -apple-system, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--font); font-size: 16px; color: #111; background: #fff;
      padding: calc(1rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) calc(5.5rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    p { margin: 0 0 0.8rem; line-height: 1.4; }
    label { display: block; font-weight: 650; margin: 0 0 0.35rem; }
    input, textarea {
      width: 100%; font: inherit; color: inherit; border: 1px solid #d5d8de; border-radius: 12px;
      padding: 0.75rem 0.8rem; background: #fff;
    }
    textarea { min-height: 140px; resize: vertical; }
    button, a.btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 48px; margin: 0 0 0.55rem;
      border: 0; border-radius: 12px; font-size: 16px; font-weight: 700;
      text-decoration: none; color: #fff; background: #111;
    }
    button.ghost, a.ghost { background: #f4f5f7; color: #111; }
    button:disabled { opacity: 0.45; }
    .hint, .build { color: #5c6570; }
    .card {
      margin: 0 0 0.55rem; padding: 0.75rem 0.8rem; border-radius: 12px; background: #f4f5f7;
      display: flex; justify-content: space-between; gap: 0.6rem; text-align: left; font-weight: 650;
    }
    .card.active { outline: 2px solid #111; }
    .note {
      padding: 0.75rem 0.8rem; border-radius: 12px; background: #f4f5f7; margin: 0 0 0.8rem;
    }
    .note.error { background: #fde8e8; }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 0.6rem max(1rem, env(safe-area-inset-right)) calc(0.6rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
    }
    #file { display: none; }
  </style>
</head>
<body>
  <h1>Danh bạ</h1>
  <p class="hint" id="install">Phần mềm đang chạy. Dán số, rồi bấm Nạp lên iPhone. App tự chia mỗi 5000 số. Một số chỉ nằm trong một nhóm. Mở lại đúng đường dẫn này để lấy bản mới.</p>
  <p class="note" id="upgrade" hidden>Có bản mới trên hub.</p>
  <p id="status" class="hint">Tên mặc định Khach.</p>
  <label for="title">Tên danh bạ</label>
  <input id="title" value="Khach" autocomplete="off" />
  <label for="paste">Danh sách số</label>
  <textarea id="paste" placeholder="0901234567"></textarea>
  <button id="fileButton" class="ghost" type="button">Chọn file</button>
  <input id="file" type="file" accept=".txt,.csv,.vcf,.vcard,.json,text/plain,text/csv,text/vcard" />
  <div id="books"></div>
  <p id="message" class="note" hidden></p>
  <p class="build" id="buildLine">Phiên bản 3</p>
  <div class="bar">
    <button id="go" type="button">Nạp lên iPhone</button>
    <button id="remove" class="ghost" type="button" hidden>Xoá nhóm đang dùng</button>
  </div>
  <script>
    window.DANHBA_BUILD = 3;
  </script>
  <script>
(function (root) {
  var MAX_DRAFTS = 100000;
  var PAGE_SIZE = 5000;
  var HEADER_WORDS = {
    name: true,
    ten: true,
    "tên": true,
    "ho ten": true,
    "họ tên": true,
    hoten: true,
    "họ và tên": true,
    phone: true,
    sdt: true,
    "sđt": true,
    "so dien thoai": true,
    "số điện thoại": true,
    tel: true,
    mobile: true,
    "điện thoại": true
  };

  function cleanName(value) {
    var collapsed = String(value || "").split(/\s+/).filter(Boolean).join(" ");
    return collapsed.length <= 80 ? collapsed : collapsed.slice(0, 80);
  }

  function nameKey(value) {
    return cleanName(value).toLowerCase();
  }

  function cleanTitle(raw) {
    var collapsed = String(raw || "").split(/\s+/).filter(Boolean).join(" ");
    if (!collapsed) return "";
    return collapsed.slice(0, 40);
  }

  function normalizePhone(raw) {
    var text = String(raw || "").trim();
    if (text.toLowerCase().indexOf("tel:") === 0) {
      text = text.slice(4).trim();
    }
    if (!text) return null;
    var digits = "";
    var leadingPlus = false;
    var started = false;
    for (var i = 0; i < text.length; i += 1) {
      var character = text.charAt(i);
      if (!started && character === "+") {
        leadingPlus = true;
        started = true;
        continue;
      }
      started = true;
      if (character >= "0" && character <= "9") {
        digits += character;
        continue;
      }
      if (character === " " || character === "-" || character === "(" || character === ")" || character === "." || character === "\t") {
        continue;
      }
      break;
    }
    if (digits.length < 8 || digits.length > 15) return null;
    if (digits.length === 11 && digits.indexOf("84") === 0) {
      return "0" + digits.slice(2);
    }
    return leadingPlus ? "+" + digits : digits;
  }

  function splitCSV(line) {
    var fields = [];
    var current = "";
    var inQuotes = false;
    var index = 0;
    while (index < line.length) {
      var character = line.charAt(index);
      if (inQuotes) {
        if (character === "\"") {
          if (line.charAt(index + 1) === "\"") {
            current += "\"";
            index += 2;
            continue;
          }
          inQuotes = false;
        } else {
          current += character;
        }
      } else if (character === "\"" && current === "") {
        inQuotes = true;
      } else if (character === "," || character === ";" || character === "\t") {
        fields.push(current.trim());
        current = "";
      } else {
        current += character;
      }
      index += 1;
    }
    fields.push(current.trim());
    return fields;
  }

  function isHeader(fields) {
    if (fields.length < 2) return false;
    for (var i = 0; i < fields.length; i += 1) {
      if (!HEADER_WORDS[nameKey(fields[i])]) return false;
    }
    return true;
  }

  function draftsFromLine(line, fields) {
    var phones = [];
    var nameParts = [];
    var i;
    for (i = 0; i < fields.length; i += 1) {
      var phone = normalizePhone(fields[i]);
      if (phone) phones.push(phone);
      else {
        var piece = cleanName(fields[i]);
        if (piece) nameParts.push(piece);
      }
    }
    if (!phones.length) {
      var parts = line.split(/\s+/).filter(Boolean);
      if (parts.length >= 2) {
        var tail = normalizePhone(parts[parts.length - 1]);
        var head = cleanName(parts.slice(0, -1).join(" "));
        if (tail && head) return [{ name: head, phone: tail }];
      }
      var whole = normalizePhone(line);
      if (whole) return [{ name: whole, phone: whole }];
      var onlyName = cleanName(fields.join(" "));
      return onlyName ? [{ name: onlyName, phone: null }] : [];
    }
    var name = nameParts.join(" ");
    return phones.map(function (phone) {
      return { name: name || phone, phone: phone };
    });
  }

  function parseLines(text) {
    var lines = String(text || "").replace(/^\uFEFF/, "").split(/\r\n|\n|\r/);
    var raw = [];
    var extra = false;
    for (var index = 0; index < lines.length; index += 1) {
      if (index >= 100000) {
        extra = true;
        break;
      }
      var trimmed = lines[index].trim();
      if (!trimmed || trimmed.charAt(0) === "#") continue;
      var fields = splitCSV(trimmed);
      if (isHeader(fields)) continue;
      raw = raw.concat(draftsFromLine(trimmed, fields));
    }
    var seen = {};
    var drafts = [];
    var truncated = extra;
    for (var j = 0; j < raw.length; j += 1) {
      var key = nameKey(raw[j].name) + "|" + (raw[j].phone || "");
      if (seen[key]) continue;
      if (drafts.length >= MAX_DRAFTS) {
        truncated = true;
        break;
      }
      seen[key] = true;
      drafts.push(raw[j]);
    }
    return { drafts: drafts, truncated: truncated };
  }

  function split(drafts, title, pageSize) {
    var base = cleanTitle(title);
    var size = pageSize || PAGE_SIZE;
    if (!base || size < 1) return null;
    var seen = {};
    var pages = [];
    var current = [];
    var duplicatePhones = 0;
    for (var i = 0; i < drafts.length; i += 1) {
      var phone = drafts[i].phone;
      if (!phone) continue;
      if (seen[phone]) {
        duplicatePhones += 1;
        continue;
      }
      seen[phone] = true;
      if (current.length === size) {
        pages.push(current);
        current = [];
      }
      current.push({ name: drafts[i].name, phone: phone });
    }
    if (current.length) pages.push(current);
    var books = pages.map(function (entries, index) {
      return {
        id: "book-" + (index + 1) + "-" + base,
        name: base + " " + (index + 1),
        entries: entries,
        sent: false
      };
    });
    return { books: books, duplicatePhones: duplicatePhones };
  }

  function phonesAreUnique(books) {
    var seen = {};
    for (var i = 0; i < books.length; i += 1) {
      var entries = books[i].entries || [];
      for (var j = 0; j < entries.length; j += 1) {
        if (seen[entries[j].phone]) return false;
        seen[entries[j].phone] = true;
      }
    }
    return true;
  }

  function escapeValue(value) {
    return String(value || "")
      .replace(/\\/g, "\\\\")
      .replace(/\n/g, "\\n")
      .replace(/,/g, "\\,")
      .replace(/;/g, "\\;");
  }

  function vcard(book) {
    var lines = [];
    var entries = book.entries || [];
    for (var i = 0; i < entries.length; i += 1) {
      var name = escapeValue(entries[i].name || entries[i].phone);
      var group = escapeValue(book.name);
      lines.push("BEGIN:VCARD");
      lines.push("VERSION:3.0");
      lines.push("FN:" + name);
      lines.push("ORG:" + group);
      lines.push("TEL;TYPE=CELL:" + entries[i].phone);
      lines.push("NOTE:" + group);
      lines.push("END:VCARD");
    }
    return lines.join("\r\n") + "\r\n";
  }

  root.DanhBa = {
    pageSize: PAGE_SIZE,
    cleanTitle: cleanTitle,
    normalizePhone: normalizePhone,
    parseLines: parseLines,
    split: split,
    phonesAreUnique: phonesAreUnique,
    vcard: vcard
  };
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
  <script>
    var BUILD = window.DANHBA_BUILD;
    var titleInput = document.getElementById("title");
    var pasteInput = document.getElementById("paste");
    var statusLine = document.getElementById("status");
    var message = document.getElementById("message");
    var booksBox = document.getElementById("books");
    var goButton = document.getElementById("go");
    var removeButton = document.getElementById("remove");
    var library = loadLibrary();

    function loadLibrary() {
      try {
        var saved = JSON.parse(localStorage.getItem("danhba-library") || "null");
        if (saved && Array.isArray(saved.books)) return saved;
      } catch (err) {}
      return { title: "Khach", books: [], activeId: null };
    }

    function saveLibrary() {
      try {
        localStorage.setItem("danhba-library", JSON.stringify(library));
      } catch (err) {}
    }

    function showMessage(text, isError) {
      message.hidden = !text;
      message.textContent = text || "";
      message.className = isError ? "note error" : "note";
    }

    function activeBook() {
      var books = library.books || [];
      for (var i = 0; i < books.length; i += 1) {
        if (books[i].id === library.activeId) return books[i];
      }
      return books[0] || null;
    }

    function nextUnsent() {
      var books = library.books || [];
      for (var i = 0; i < books.length; i += 1) {
        if (!books[i].sent) return books[i];
      }
      return null;
    }

    function render() {
      var books = library.books || [];
      var ready = books.filter(function (book) { return book.sent; }).length;
      var current = activeBook();
      if (!books.length) {
        statusLine.textContent = "Tên mặc định Khach. Dán số, rồi bấm Nạp lên iPhone.";
      } else if (current && current.sent) {
        statusLine.textContent = "Đang dùng " + current.name + ". " + ready + "/" + books.length + " nhóm đã đưa sang Danh bạ.";
      } else {
        statusLine.textContent = books.length + " danh bạ đã chia. Bấm Nạp lên iPhone.";
      }
      var upcoming = nextUnsent();
      var pendingText = (pasteInput.value || "").trim();
      var finished = books.length > 0 && !upcoming && !pendingText;
      goButton.textContent = finished ? "Đã nạp hết" : "Nạp lên iPhone";
      goButton.disabled = finished;
      removeButton.hidden = !(current && current.sent);
      removeButton.textContent = current && current.sent ? "Xoá " + current.name : "Xoá nhóm đang dùng";
      booksBox.textContent = "";
      books.forEach(function (book) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "card" + (book.id === (current && current.id) ? " active" : "");
        var name = document.createElement("span");
        name.textContent = book.name + " · " + book.entries.length + " số";
        var mark = document.createElement("span");
        mark.textContent = book.sent ? "Đã nạp" : "Chưa nạp";
        button.appendChild(name);
        button.appendChild(mark);
        button.addEventListener("click", function () {
          library.activeId = book.id;
          saveLibrary();
          render();
        });
        booksBox.appendChild(button);
      });
    }

    function titleNow() {
      var clean = DanhBa.cleanTitle(titleInput.value);
      if (!clean) {
        clean = "Khach";
        titleInput.value = clean;
      }
      library.title = clean;
      return clean;
    }

    async function handOff(books) {
      var body = books.map(function (book) { return DanhBa.vcard(book); }).join("");
      var fileName = (library.title || "Khach") + ".vcf";
      var file = new File([body], fileName, { type: "text/vcard" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: library.title || "Khach" });
          return true;
        } catch (err) {
          if (err && err.name === "AbortError") return false;
        }
      }
      var url = URL.createObjectURL(new Blob([body], { type: "text/vcard" }));
      var link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      return true;
    }

    async function start(text) {
      titleNow();
      var pending = (text || "").trim();
      if (pending) {
        var batch = DanhBa.parseLines(pending);
        var phones = batch.drafts.filter(function (row) { return row.phone; }).length;
        if (!phones) {
          showMessage("Không thấy số điện thoại nào trong danh sách.", true);
          return;
        }
        var result = DanhBa.split(batch.drafts, library.title);
        if (!result || !result.books.length) {
          showMessage("Không có số điện thoại hợp lệ.", true);
          return;
        }
        library.books = result.books;
        library.activeId = result.books[0].id;
        saveLibrary();
        var summary = "Đã chia " + result.books.length + " danh bạ, mỗi cuốn tối đa " + DanhBa.pageSize + " số.";
        if (result.duplicatePhones) summary += " Bỏ " + result.duplicatePhones + " số trùng.";
        summary += " Mỗi số chỉ nằm trong một danh bạ.";
        if (batch.truncated) summary += " Danh sách quá dài, chỉ lấy phần đầu.";
        showMessage(summary, false);
      }
      var queue = (library.books || []).filter(function (item) { return !item.sent; });
      if (!queue.length) {
        if (!(library.books || []).length) showMessage("Dán số hoặc chọn file.", true);
        render();
        return;
      }
      var handed = await handOff(queue);
      if (!handed) {
        render();
        return;
      }
      var count = 0;
      queue.forEach(function (item) {
        item.sent = true;
        count += item.entries.length;
      });
      library.activeId = queue[0].id;
      saveLibrary();
      showMessage("iPhone sẽ hỏi thêm " + count + " số, chia trong " + queue.length + " nhóm. Bấm Thêm tất cả. Mỗi số chỉ nằm trong một nhóm.", false);
      render();
    }

    var running = false;
    goButton.addEventListener("click", function () {
      if (running) return;
      running = true;
      start(pasteInput.value).then(function () {
        running = false;
      }, function () {
        running = false;
      });
    });
    pasteInput.addEventListener("input", render);

    document.getElementById("fileButton").addEventListener("click", function () {
      document.getElementById("file").click();
    });

    document.getElementById("file").addEventListener("change", function (event) {
      var file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file) return;
      if (file.size > 12000000) {
        showMessage("File quá lớn hoặc không đọc được.", true);
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        var text = String(reader.result || "");
        pasteInput.value = text;
        start(text);
      };
      reader.onerror = function () {
        showMessage("Không mở được file.", true);
      };
      reader.readAsText(file);
    });

    removeButton.addEventListener("click", function () {
      var book = activeBook();
      if (!book || !book.sent) return;
      var accepted = window.confirm("Bỏ " + book.name + " trong phần mềm và chuyển sang nhóm kế. iPhone không cho trang web xoá số đã thêm. Trong app Danh bạ, tìm " + book.name + " rồi xoá các số đó.");
      if (!accepted) return;
      library.books = library.books.filter(function (item) { return item.id !== book.id; });
      var next = library.books.filter(function (item) { return item.sent; })[0] || library.books[0] || null;
      library.activeId = next ? next.id : null;
      saveLibrary();
      showMessage(next ? "Đã bỏ " + book.name + ". Đang dùng " + next.name + "." : "Đã bỏ " + book.name + ".", false);
      render();
    });

    if (location.pathname.indexOf("/danhba") === 0 && "serviceWorker" in navigator) {
      var reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
      navigator.serviceWorker.register("/danhba/sw.js", { scope: "/danhba/" }).then(function (registration) {
        registration.update();
      }).catch(function () {});
    }

    if (location.pathname.indexOf("/danhba") === 0) fetch("/danhba/version", { cache: "no-store" }).then(function (response) {
      return response.json();
    }).then(function (info) {
      if (!info || info.build === BUILD) return;
      var current = new URL(location.href);
      if (current.searchParams.get("v") === String(info.build)) {
        var upgrade = document.getElementById("upgrade");
        upgrade.hidden = false;
        var update = document.createElement("button");
        update.type = "button";
        update.textContent = "Cập nhật";
        update.addEventListener("click", function () {
          current.searchParams.set("v", String(Date.now()));
          location.replace(current.toString());
        });
        upgrade.appendChild(update);
        return;
      }
      current.searchParams.set("v", String(info.build));
      location.replace(current.toString());
    }).catch(function () {});

    if (library.title) titleInput.value = library.title;
    render();
  </script>
</body>
</html>
