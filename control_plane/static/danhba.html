<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Danh bạ" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="danhba-build" content="5" />
  <link rel="manifest" href="/danhba/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Danh bạ</title>
  <style>
    :root { --font: -apple-system, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--font); font-size: 16px; color: #111; background: #fff;
      padding: calc(1rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) calc(9.5rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    h2 { font-size: 1rem; margin: 1rem 0 0.4rem; }
    p { margin: 0 0 0.8rem; line-height: 1.4; }
    label { display: block; font-weight: 650; margin: 0 0 0.35rem; }
    label.check { display: flex; align-items: flex-start; gap: 0.6rem; font-weight: 650; }
    label.check input { width: 1.25rem; height: 1.25rem; margin-top: 0.15rem; }
    input, textarea {
      width: 100%; font: inherit; color: inherit; border: 1px solid #d5d8de; border-radius: 12px;
      padding: 0.75rem 0.8rem; background: #fff;
    }
    textarea { min-height: 140px; resize: vertical; }
    button, a.btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 48px; margin: 0 0 0.55rem;
      border: 0; border-radius: 12px; font-size: 16px; font-weight: 700;
      text-decoration: none; color: #fff; background: #111;
    }
    button.ghost, a.ghost { background: #f4f5f7; color: #111; }
    button:disabled { opacity: 0.45; }
    .hint, .build { color: #5c6570; }
    .card {
      margin: 0 0 0.55rem; padding: 0.75rem 0.8rem; border-radius: 12px; background: #f4f5f7;
      display: flex; justify-content: space-between; gap: 0.6rem; text-align: left; font-weight: 650;
    }
    .card.active { outline: 2px solid #111; }
    .note {
      padding: 0.75rem 0.8rem; border-radius: 12px; background: #f4f5f7; margin: 0 0 0.8rem;
    }
    .note.error { background: #fde8e8; }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 0.6rem max(1rem, env(safe-area-inset-right)) calc(0.6rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
    }
    #syncFile { display: none; }
  </style>
</head>
<body>
  <h1>Danh bạ</h1>
  <p class="hint" id="install">Danh sách trên hub và trang này tự khớp. Mỗi danh bạ 5000 số. Sau khi iPhone hỏi Thêm tất cả, bấm Đã thêm vào iPhone. Xuất file danh bạ của máy rồi bấm Đối chiếu iPhone để khớp theo số thật.</p>
  <p class="note" id="upgrade" hidden>Có bản mới trên hub.</p>
  <p id="status" class="hint">Đang lấy danh bạ trên hub.</p>
  <label for="token">Token hub</label>
  <input id="token" type="password" autocomplete="off" />
  <label class="check" for="full"><input id="full" type="checkbox" /> File này là toàn bộ danh bạ trên iPhone</label>
  <h2>Chưa dùng</h2>
  <div id="ready"></div>
  <h2>Đã dùng</h2>
  <div id="used"></div>
  <p id="message" class="note" hidden></p>
  <p class="build" id="buildLine">Phiên bản 5</p>
  <div class="bar">
    <button id="go" type="button">Nạp lên iPhone</button>
    <button id="sync" class="ghost" type="button">Đối chiếu iPhone</button>
  </div>
  <input id="syncFile" type="file" accept=".vcf,.vcard,.txt,text/vcard,text/x-vcard,text/plain" />
  <script>
    window.DANHBA_BUILD = 5;
  </script>
  <script>
(function (root) {
  var MAX_DRAFTS = 100000;
  var PAGE_SIZE = 5000;
  var HEADER_WORDS = {
    name: true,
    ten: true,
    "tên": true,
    "ho ten": true,
    "họ tên": true,
    hoten: true,
    "họ và tên": true,
    phone: true,
    sdt: true,
    "sđt": true,
    "so dien thoai": true,
    "số điện thoại": true,
    tel: true,
    mobile: true,
    "điện thoại": true
  };

  function cleanName(value) {
    var collapsed = String(value || "").split(/\s+/).filter(Boolean).join(" ");
    return collapsed.length <= 80 ? collapsed : collapsed.slice(0, 80);
  }

  function nameKey(value) {
    return cleanName(value).toLowerCase();
  }

  function cleanTitle(raw) {
    var collapsed = String(raw || "").split(/\s+/).filter(Boolean).join(" ");
    if (!collapsed) return "";
    return collapsed.slice(0, 40);
  }

  function normalizePhone(raw) {
    var text = String(raw || "").trim();
    if (text.toLowerCase().indexOf("tel:") === 0) {
      text = text.slice(4).trim();
    }
    if (!text) return null;
    var digits = "";
    var leadingPlus = false;
    var started = false;
    for (var i = 0; i < text.length; i += 1) {
      var character = text.charAt(i);
      if (!started && character === "+") {
        leadingPlus = true;
        started = true;
        continue;
      }
      started = true;
      if (character >= "0" && character <= "9") {
        digits += character;
        continue;
      }
      if (character === " " || character === "-" || character === "(" || character === ")" || character === "." || character === "\t") {
        continue;
      }
      break;
    }
    if (digits.length < 8 || digits.length > 15) return null;
    if (digits.length === 11 && digits.indexOf("84") === 0) {
      return "0" + digits.slice(2);
    }
    return leadingPlus ? "+" + digits : digits;
  }

  function splitCSV(line) {
    var fields = [];
    var current = "";
    var inQuotes = false;
    var index = 0;
    while (index < line.length) {
      var character = line.charAt(index);
      if (inQuotes) {
        if (character === "\"") {
          if (line.charAt(index + 1) === "\"") {
            current += "\"";
            index += 2;
            continue;
          }
          inQuotes = false;
        } else {
          current += character;
        }
      } else if (character === "\"" && current === "") {
        inQuotes = true;
      } else if (character === "," || character === ";" || character === "\t") {
        fields.push(current.trim());
        current = "";
      } else {
        current += character;
      }
      index += 1;
    }
    fields.push(current.trim());
    return fields;
  }

  function isHeader(fields) {
    if (fields.length < 2) return false;
    for (var i = 0; i < fields.length; i += 1) {
      if (!HEADER_WORDS[nameKey(fields[i])]) return false;
    }
    return true;
  }

  function draftsFromLine(line, fields) {
    var phones = [];
    var nameParts = [];
    var i;
    for (i = 0; i < fields.length; i += 1) {
      var phone = normalizePhone(fields[i]);
      if (phone) phones.push(phone);
      else {
        var piece = cleanName(fields[i]);
        if (piece) nameParts.push(piece);
      }
    }
    if (!phones.length) {
      var parts = line.split(/\s+/).filter(Boolean);
      if (parts.length >= 2) {
        var tail = normalizePhone(parts[parts.length - 1]);
        var head = cleanName(parts.slice(0, -1).join(" "));
        if (tail && head) return [{ name: head, phone: tail }];
      }
      var whole = normalizePhone(line);
      if (whole) return [{ name: whole, phone: whole }];
      var onlyName = cleanName(fields.join(" "));
      return onlyName ? [{ name: onlyName, phone: null }] : [];
    }
    var name = nameParts.join(" ");
    return phones.map(function (phone) {
      return { name: name || phone, phone: phone };
    });
  }

  function parseLines(text) {
    var lines = String(text || "").replace(/^\uFEFF/, "").split(/\r\n|\n|\r/);
    var raw = [];
    var extra = false;
    for (var index = 0; index < lines.length; index += 1) {
      if (index >= 100000) {
        extra = true;
        break;
      }
      var trimmed = lines[index].trim();
      if (!trimmed || trimmed.charAt(0) === "#") continue;
      var fields = splitCSV(trimmed);
      if (isHeader(fields)) continue;
      raw = raw.concat(draftsFromLine(trimmed, fields));
    }
    var seen = {};
    var drafts = [];
    var truncated = extra;
    for (var j = 0; j < raw.length; j += 1) {
      var key = nameKey(raw[j].name) + "|" + (raw[j].phone || "");
      if (seen[key]) continue;
      if (drafts.length >= MAX_DRAFTS) {
        truncated = true;
        break;
      }
      seen[key] = true;
      drafts.push(raw[j]);
    }
    return { drafts: drafts, truncated: truncated };
  }

  function split(drafts, title, pageSize) {
    var base = cleanTitle(title);
    var size = pageSize || PAGE_SIZE;
    if (!base || size < 1) return null;
    var seen = {};
    var pages = [];
    var current = [];
    var duplicatePhones = 0;
    for (var i = 0; i < drafts.length; i += 1) {
      var phone = drafts[i].phone;
      if (!phone) continue;
      if (seen[phone]) {
        duplicatePhones += 1;
        continue;
      }
      seen[phone] = true;
      if (current.length === size) {
        pages.push(current);
        current = [];
      }
      current.push({ name: drafts[i].name, phone: phone });
    }
    if (current.length) pages.push(current);
    var books = pages.map(function (entries, index) {
      return {
        id: "book-" + (index + 1) + "-" + base,
        name: base + " " + (index + 1),
        entries: entries,
        sent: false
      };
    });
    return { books: books, duplicatePhones: duplicatePhones };
  }

  function phonesAreUnique(books) {
    var seen = {};
    for (var i = 0; i < books.length; i += 1) {
      var entries = books[i].entries || [];
      for (var j = 0; j < entries.length; j += 1) {
        if (seen[entries[j].phone]) return false;
        seen[entries[j].phone] = true;
      }
    }
    return true;
  }

  function escapeValue(value) {
    return String(value || "")
      .replace(/\\/g, "\\\\")
      .replace(/\n/g, "\\n")
      .replace(/,/g, "\\,")
      .replace(/;/g, "\\;");
  }

  function vcard(book) {
    var lines = [];
    var entries = book.entries || [];
    for (var i = 0; i < entries.length; i += 1) {
      var name = escapeValue(entries[i].name || entries[i].phone);
      var group = escapeValue(book.name);
      lines.push("BEGIN:VCARD");
      lines.push("VERSION:3.0");
      lines.push("FN:" + name);
      lines.push("ORG:" + group);
      lines.push("TEL;TYPE=CELL:" + entries[i].phone);
      lines.push("NOTE:" + group);
      lines.push("END:VCARD");
    }
    return lines.join("\r\n") + "\r\n";
  }

  root.DanhBa = {
    pageSize: PAGE_SIZE,
    cleanTitle: cleanTitle,
    normalizePhone: normalizePhone,
    parseLines: parseLines,
    split: split,
    phonesAreUnique: phonesAreUnique,
    vcard: vcard
  };
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
  <script>
    var BUILD = window.DANHBA_BUILD;
    var tokenInput = document.getElementById("token");
    var statusLine = document.getElementById("status");
    var message = document.getElementById("message");
    var readyBox = document.getElementById("ready");
    var usedBox = document.getElementById("used");
    var goButton = document.getElementById("go");
    var syncButton = document.getElementById("sync");
    var syncFile = document.getElementById("syncFile");
    var fullInput = document.getElementById("full");
    var books = { ready: [], used: [] };
    var activeId = null;
    var running = false;
    var revision = "";
    var loaded = false;
    tokenInput.value = localStorage.getItem("fb_poller_control_token") || "";

    function showMessage(text, isError) {
      message.hidden = !text;
      message.textContent = text || "";
      message.className = isError ? "note error" : "note";
    }

    function authHeaders() {
      var headers = { Accept: "application/json" };
      var token = tokenInput.value.trim();
      if (token) headers.Authorization = "Bearer " + token;
      return headers;
    }

    function rememberToken() {
      localStorage.setItem("fb_poller_control_token", tokenInput.value.trim());
    }

    function readPending() {
      try {
        return sessionStorage.getItem("danhba-pending") || "";
      } catch (err) {
        return "";
      }
    }

    function writePending(id) {
      try {
        if (id) sessionStorage.setItem("danhba-pending", id);
        else sessionStorage.removeItem("danhba-pending");
      } catch (err) {}
    }

    function selectedReady() {
      var list = books.ready || [];
      for (var i = 0; i < list.length; i += 1) {
        if (list[i].id === activeId) return list[i];
      }
      return list[0] || null;
    }

    function pendingBook() {
      var id = readPending();
      var list = books.ready || [];
      for (var i = 0; i < list.length; i += 1) {
        if (list[i].id === id) return list[i];
      }
      if (loaded && id) writePending("");
      return null;
    }

    function card(book, box, current) {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "card" + (book.id === current ? " active" : "");
      var name = document.createElement("span");
      name.textContent = book.name + " · " + book.count + " số";
      var mark = document.createElement("span");
      mark.textContent = book.status === "used" ? "Đã dùng" : "Chưa dùng";
      button.appendChild(name);
      button.appendChild(mark);
      if (book.status !== "used") {
        button.addEventListener("click", function () {
          if (readPending() && readPending() !== book.id) writePending("");
          activeId = book.id;
          render();
        });
      }
      box.appendChild(button);
    }

    function render() {
      var ready = books.ready || [];
      var used = books.used || [];
      var pending = pendingBook();
      var current = selectedReady();
      activeId = current ? current.id : null;
      statusLine.textContent = pending
        ? "Đã đưa " + pending.name + ". Bấm Thêm tất cả, rồi bấm Đã thêm vào iPhone."
        : ready.length
          ? ready.length + " danh bạ chưa dùng. Bấm Nạp lên iPhone."
          : "Chưa có danh bạ chờ. Nạp danh sách từ máy tính.";
      goButton.disabled = pending ? false : !current;
      goButton.textContent = pending
        ? "Đã thêm " + pending.name + " vào iPhone"
        : current
          ? "Nạp " + current.name
          : "Nạp lên iPhone";
      readyBox.textContent = "";
      usedBox.textContent = "";
      if (!ready.length) readyBox.textContent = "Chưa có danh bạ.";
      ready.forEach(function (book) { card(book, readyBox, pending ? pending.id : activeId); });
      if (!used.length) usedBox.textContent = "Chưa có danh bạ đã dùng.";
      used.forEach(function (book) { card(book, usedBox, null); });
    }

    function applyBooks(payload, force) {
      var next = (payload && payload.revision) || "";
      if (!force && next && next === revision) return;
      revision = next;
      loaded = true;
      books = payload || { ready: [], used: [] };
      render();
    }

    async function refresh(force) {
      if (running && !force) return;
      if (location.pathname.indexOf("/danhba") !== 0) {
        showMessage("Mở trang này trên hub của VPS. Danh sách nạp từ máy tính, không nằm trong file chung.", true);
        render();
        return;
      }
      var response = await fetch("/v1/danhba/books", { headers: authHeaders(), cache: "no-store" });
      if (response.status === 401) {
        showMessage("Dán token hub, rồi bấm Nạp lên iPhone.", true);
        revision = "";
        books = { ready: [], used: [] };
        render();
        return;
      }
      if (!response.ok) {
        showMessage("Không lấy được danh bạ trên hub.", true);
        render();
        return;
      }
      rememberToken();
      applyBooks(await response.json(), force);
    }

    async function handOff(book) {
      var fileName = book.name + ".vcf";
      var body = DanhBa.vcard(book);
      var file = new File([body], fileName, { type: "text/vcard" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: book.name });
          return true;
        } catch (err) {
          if (err && err.name === "AbortError") return false;
        }
      }
      var url = URL.createObjectURL(new Blob([body], { type: "text/vcard" }));
      var link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      return true;
    }

    async function loadSelected() {
      var summary = selectedReady();
      if (!summary) {
        showMessage("Chưa có danh bạ chờ. Nạp danh sách từ máy tính.", true);
        return;
      }
      var response = await fetch("/v1/danhba/books/" + encodeURIComponent(summary.id), {
        headers: authHeaders(),
        cache: "no-store"
      });
      if (response.status === 401) {
        showMessage("Dán token hub, rồi bấm Nạp lên iPhone.", true);
        return;
      }
      if (!response.ok) {
        showMessage("Không mở được danh bạ.", true);
        return;
      }
      var book = await response.json();
      var handed = await handOff(book);
      if (!handed) return;
      writePending(book.id);
      showMessage("iPhone sẽ hỏi thêm " + book.entries.length + " số của " + book.name + ". Bấm Thêm tất cả, rồi bấm Đã thêm vào iPhone.", false);
      render();
    }

    async function confirmUse(book) {
      var marked = await fetch("/v1/danhba/books/" + encodeURIComponent(book.id) + "/use", {
        method: "POST",
        headers: authHeaders()
      });
      if (marked.status === 401) {
        showMessage("Dán token hub, rồi bấm Đã thêm vào iPhone.", true);
        return;
      }
      if (!marked.ok) {
        showMessage("Hub chưa chuyển danh bạ sang Đã dùng.", true);
        return;
      }
      writePending("");
      activeId = null;
      showMessage(book.name + " đã chuyển sang Đã dùng.", false);
      await refresh(true);
    }

    function syncSummary(payload) {
      var text = "Đã đối chiếu " + payload.seenPhones + " số.";
      if (payload.movedToUsed) text += " Chuyển " + payload.movedToUsed + " danh bạ sang Đã dùng.";
      if (payload.movedToReady) text += " Trả " + payload.movedToReady + " danh bạ về Chưa dùng.";
      if (!payload.movedToUsed && !payload.movedToReady) text += " Chưa có danh bạ nào khớp đủ số.";
      if (payload.unknownPhones) text += " " + payload.unknownPhones + " số trên máy không có trong hub.";
      return text;
    }

    async function reconcile(text) {
      var headers = authHeaders();
      headers["Content-Type"] = "application/json";
      var response = await fetch("/v1/danhba/sync", {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ text: text, full: fullInput.checked })
      });
      if (response.status === 401) {
        showMessage("Dán token hub, rồi bấm Đối chiếu iPhone.", true);
        return;
      }
      var payload = await response.json();
      if (!response.ok) {
        showMessage(payload.detail || "Không đối chiếu được.", true);
        return;
      }
      rememberToken();
      writePending("");
      showMessage(syncSummary(payload), false);
      applyBooks(payload, true);
    }

    goButton.addEventListener("click", function () {
      if (running) return;
      rememberToken();
      var pending = pendingBook();
      running = true;
      var job = pending ? confirmUse(pending) : loadSelected();
      job.then(function () {
        running = false;
      }, function () {
        running = false;
        showMessage("Không nạp được danh bạ.", true);
      });
    });

    syncButton.addEventListener("click", function () {
      if (running) return;
      syncFile.click();
    });
    syncFile.addEventListener("change", function (event) {
      var file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file || running) return;
      if (file.size > 20000000) {
        showMessage("File quá lớn.", true);
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        running = true;
        reconcile(String(reader.result || "")).then(function () {
          running = false;
        }, function () {
          running = false;
          showMessage("Không đối chiếu được.", true);
        });
      };
      reader.onerror = function () {
        showMessage("Không mở được file.", true);
      };
      reader.readAsText(file);
    });

    if (location.pathname.indexOf("/danhba") === 0 && "serviceWorker" in navigator) {
      var reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
      navigator.serviceWorker.register("/danhba/sw.js", { scope: "/danhba/" }).then(function (registration) {
        registration.update();
      }).catch(function () {});
    }

    if (location.pathname.indexOf("/danhba") === 0) fetch("/danhba/version", { cache: "no-store" }).then(function (response) {
      return response.json();
    }).then(function (info) {
      if (!info || info.build === BUILD) return;
      var current = new URL(location.href);
      if (current.searchParams.get("v") === String(info.build)) {
        var upgrade = document.getElementById("upgrade");
        upgrade.hidden = false;
        var update = document.createElement("button");
        update.type = "button";
        update.textContent = "Cập nhật";
        update.addEventListener("click", function () {
          current.searchParams.set("v", String(Date.now()));
          location.replace(current.toString());
        });
        upgrade.appendChild(update);
        return;
      }
      current.searchParams.set("v", String(info.build));
      location.replace(current.toString());
    }).catch(function () {});

    render();
    refresh(true);
    if (location.pathname.indexOf("/danhba") === 0) {
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) refresh(false);
      });
      setInterval(function () {
        refresh(false);
      }, 5000);
    }
  </script>
</body>
</html>
